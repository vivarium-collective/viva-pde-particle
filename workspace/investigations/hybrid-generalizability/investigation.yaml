schema_version: 2
name: hybrid-generalizability
title: What the modular hybrid co-simulation enables beyond the embedded solver
created: '2026-10-03'
status: running
question: >-
  Once the co-simulation reproduces the embedded hybrid solver, which capabilities does
  the modular decomposition add, such as unstructured meshes, alternative splitting
  schemes and swappable engines, and what do they cost in accuracy and performance?
hypothesis: >-
  Swapping the finite volume PDE process for a FEniCSx process changes results only by
  the PDE discretization error. Particle-to-mesh-cell binning extends the method to
  non-box geometries. Higher-order splitting (Strang) reduces the coupling error at
  modest extra cost, which the hard-coded solver cannot offer.
description: |
  Builds on cosim-vs-embedded-hybrid. Every study reuses the same HybridModel and
  partitioner and changes one component at a time:

  - the PDE engine (numpy finite volume vs FEniCSx),
  - the geometry (box vs unstructured),
  - the splitting scheme (lagged Jacobi as in fvsolver, Gauss-Seidel, Strang),
  - optionally, the particle engine.
at_a_glance:
- study: fenicsx-same-problem
  role: FEniCSx PDE process on a mesh matched to the FV grid; separates discretization error from coupling error.
- study: unstructured-geometry
  role: Non-box geometry using bounding-box-tree particle-to-cell binning and Smoldyn surfaces generated from the mesh boundary.
- study: splitting-schemes
  role: Lagged Jacobi vs Gauss-Seidel vs Strang splitting; accuracy vs cost.
- study: engine-swap
  role: The same composite with the PDE engine (and optionally the particle engine) swapped.
- study: membrane-particles
  role: Stretch goal, membrane-bound particles and surface actions with panel-indexed binning.
executive:
  what_is_this: >-
    A study of the generality gained by decomposing the hybrid solver into
    process-bigraph processes.
  verdict: Not yet run.
  verdict_status: pending
studies:
