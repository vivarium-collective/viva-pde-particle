schema_version: 4
name: bimolecular-hybrid
title: "A_particle + B_field → C_field: two-way nonlinear coupling, both solvers"
investigation: cosim-vs-embedded-hybrid
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Accepted
parent_studies:
- two-way-exchange

# What the study measures (anchors for the test rows / report).
readouts:
- name: a4_cosim_vs_native_survival_max_z
  description: max-over-time |z| of surviving A fraction, co-sim vs native
- name: a4_cosim_vs_native_c_max_z
  description: max-over-time |z| of produced C (/initial A), co-sim vs native
- name: a4_cosim_vs_native_profile_max_z
  description: max-over-time |z| of the final x-profile, co-sim vs native
- name: a4_cosim_vs_continuum_survival_max_abs_diff
  description: '|survival − continuum survival| for the co-sim'
- name: a4_native_vs_continuum_survival_max_abs_diff
  description: '|survival − continuum survival| for the native VCell hybrid'
- name: a4_cosim_mass_balance_max_rel_dev / a4_native_mass_balance_max_rel_dev
  description: B+C conservation (relative)
question: |
  When particles consume a field (B substantially depleted by A), do the co-simulation
  and the native VCell hybrid agree with each other and with the deterministic continuum
  limit?
hypothesis: |
  The particle side removes A at rate k·[B](x), and the PDE side removes k·[A_binned]·[B]
  from B and adds it to C. With 20,000 A, both solvers' ensemble means approach the
  continuum solution (A treated as a field). The solvers differ only by sampling.
  B + C is conserved exactly (PDE side).
objective: |
  11×11×3 slab; 20,000 A (D = 1, Poisson initial placement in both solvers);
  B₀ = 0.5 µM (≈30,000 molecules, D = 1); C₀ = 0 (D = 1); k = 1/(µM·s); dt = 0.01;
  t = 3 s; 16 seeds per solver. Compared:
  - surviving fraction, produced C and final x-profiles (co-sim vs native);
  - survival vs the continuum FV solution.

baseline:
- name: bimolecular-slab
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params:
    n_particles: 20000
    k: 1.0
    b0: 0.5
    dt: 0.01

variants: []

# v4 Build-tab view (conditions.baseline + the two-solver / continuum arms).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.bimolecular_hybrid
    params: {n_particles: 20000, k: 1.0, b0: 0.5, dt: 0.01}
  variants:
  - name: native-vcell-arm
    diff_from_baseline: "Same model solved by the native VCell hybrid (pyvcell → libvcell → vcell-fvsolver), 16 seeds."
  - name: continuum-limit
    diff_from_baseline: "Deterministic FV continuum solution (A treated as a field) for the convergence check."

simulation_set:
- name: default
  kind: baseline
  status: ran
  base_model: viva_pde_particle.composites.examples.bimolecular_hybrid
  seeds: [0]
  metrics: [a4_cosim_vs_native_survival_max_z, a4_cosim_vs_native_c_max_z, a4_cosim_vs_continuum_survival_max_abs_diff, a4_native_vs_continuum_survival_max_abs_diff]
  pass_fail_tests: [solvers-agree-on-survival, solvers-agree-on-product, cosim-near-continuum, native-near-continuum]
  description: "A_p + B_f → C_f: 16 seeds × 2 solvers + continuum limit; results/metrics.json."

behavior_tests:
- name: solvers-agree-on-survival
  classification: primary
  description: Max over time of the two-sample |z| of the surviving A fraction, co-simulation vs native.
  measure:
    kind: derived_scalar
    field: a4_cosim_vs_native_survival_max_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Same model, mesh and coupling; independent ensembles of 16.
  requires_simulation: bimolecular-slab
  status: pass
  gate_class: regression_pin
- name: solvers-agree-on-product
  classification: primary
  description: Max over time of the two-sample |z| of produced C (/ initial A), co-simulation vs native.
  measure:
    kind: derived_scalar
    field: a4_cosim_vs_native_c_max_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: C is produced on the PDE side from binned A; any timing or units mismatch shows up here first.
  requires_simulation: bimolecular-slab
  status: pass
  gate_class: regression_pin
- name: cosim-near-continuum
  classification: primary
  description: Max over time of |survival fraction − continuum survival| for the co-simulation.
  measure:
    kind: derived_scalar
    field: a4_cosim_vs_continuum_survival_max_abs_diff
  pass_if:
    op: "<"
    value: 0.01
    provenance:
      kind: theory
      note: 20,000 molecules per run; the remainder is explicit-coupling lag plus discreteness.
  requires_simulation: bimolecular-slab
  status: pass
  gate_class: regression_pin
- name: native-near-continuum
  classification: secondary
  description: Max over time of |survival fraction − continuum survival| for the native VCell hybrid.
  measure:
    kind: derived_scalar
    field: a4_native_vs_continuum_survival_max_abs_diff
  pass_if:
    op: "<"
    value: 0.01
    provenance:
      kind: theory
      note: As above.
  requires_simulation: bimolecular-slab
  status: pass
  gate_class: regression_pin

canonical_runs:
- name: default
  script: workspace/studies/bimolecular-hybrid/sims/run.py
  args: []
  label: "A_p + B_f → C_f: 16 seeds per solver + continuum limit"
  default: true

visualizations:
- name: bimolecular-hybrid
  address: html:viz/bimolecular_hybrid.html
  chart: viz/bimolecular_hybrid.html
  render: "python sims/run.py"

conclusion: |
  Results (results/metrics.json, 2026-10-03):
  - co-sim vs native: survival |z| = 1.79, produced C |z| = 0.85, final profiles |z| = 2.10;
  - vs the continuum: within 0.29% (co-sim) and 0.18% (native) absolute survival;
  - B + C conserved to round-off in both.

  This study exposed a harness bug, now fixed. Process-bigraph accumulates process
  times as float sums (25 × 0.01 > 0.25), so recorded co-sim states were one step
  behind the record time. Before the fix the solvers appeared to disagree on C
  (|z| = 71) and on survival (|z| = 5.9). run_hybrid now advances half a step past
  each record time, and all studies were re-run.

runs:
- name: default
  emitter: json
  outcomes:
    solvers-agree-on-survival:
      result: PASS
    solvers-agree-on-product:
      result: PASS
    cosim-near-continuum:
      result: PASS
    native-near-continuum:

      result: PASS
findings:
- id: F-01
  tier: observation
  statement: >
    The co-simulation and the native VCell hybrid agree to within sampling on the
    two-way nonlinear coupling: max-over-time |z| is 1.79 for surviving A fraction,
    0.85 for produced C, and 2.10 for the final x-profile — all well under the |z| < 4
    threshold.
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: solvers-agree-on-survival}
  next_action: None — the two solvers are statistically indistinguishable on this model.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: observation
  statement: >
    Both solvers approach the deterministic continuum limit at 20,000 particles: the
    max-over-time absolute survival difference is 0.29% (co-sim) and 0.18% (native),
    both under the 1% band. The remainder is explicit-coupling lag plus discreteness.
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-near-continuum}
  next_action: None.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    B + C is conserved to round-off on the PDE side in both solvers (max relative
    deviation 3.6e-14 co-sim, 3.2e-14 native), confirming the particle-consumption /
    field-production handoff is mass-balanced. Reaching this agreement exposed and fixed
    a float-sum record-time bug in process-bigraph (pre-fix survival |z| = 5.9, C |z| = 71).
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: solvers-agree-on-product}
  next_action: >
    Carry the half-step record-time fix as a regression pin; no further action for this model.
  next_action_type: replicate

  kind: computational
  status: confirms
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all four behavior
      tests pass against it (survival |z|=1.79, C |z|=0.85, co-sim continuum 0.29%, native
      continuum 0.18%).
  biological_validation:
    basis: >
      Both the co-simulation and the native VCell hybrid converge to the deterministic
      continuum solution of the two-way bimolecular model to within ~0.3% absolute survival.
  explanatory_gain:
    basis: >
      F-03 localizes a float-sum record-time bug exposed by this nonlinear coupling (pre-fix
      |z|=71 on C), and shows the fixed process-bigraph decomposition is answer-preserving
      with exact B+C conservation.

conclusion_logic:
  if_primary_tests_pass: >
    The co-simulation reproduces the native VCell hybrid on a strongly two-way nonlinear
    coupling (survival, product and profile all within sampling) and both reach the
    deterministic continuum limit within ~0.3% — the process-bigraph decomposition is
    answer-preserving once the half-step record-time fix is applied.
  if_primary_tests_fail: >
    A solver-agreement |z| ≥ 4 or a continuum difference ≥ 1% would mean the coupling
    timing, units or binning changed the answer — re-examine the run_hybrid record-time
    handling and the particle→field mass handoff before trusting the arm.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: calibrated
  caveat: >
    Agreement bands are theory/sampling-based (independent ensembles of 16), not
    literature-matched; the native arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/bimolecular-hybrid/sims/run.py"
    produces: [results/metrics.json, viz/bimolecular_hybrid.html]
    note: >
      16 seeds × 2 solvers + continuum limit. The native arm needs the dev pixi env
      (pyvcell spatial-hybrid); in the default env only the co-sim arm runs.
  inputs_committed: [results/metrics.json]
  wall_time_s: 7.375601053237915
