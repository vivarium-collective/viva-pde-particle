schema_version: 4
name: two-way-exchange
title: Mass balance across the particle ↔ field handoff
investigation: cosim-vs-embedded-hybrid
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_reviewed
confidence: Accepted

# What the study measures (anchors for the test rows / report).
readouts:
  - a3_cosim_mass_balance_max_rel_dev — max over time of |ensemble-mean (A+B)/initial − 1|, co-sim
  - a3_cosim_steady_ratio_rel_err — relative error of the late-time total-A/total-B ratio vs k2/k1, co-sim
  - a3_cosim_creation_ratio — created A ÷ exact expectation (creation-only, static B), co-sim
  - a3_native_creation_ratio — created A ÷ exact expectation, native VCell
  - a3_native_creation_vs_bug_factor — native creation ratio ÷ Σ(full)/Σ(actual) boundary-volume prediction
  - a3_full_to_actual_cell_volume_factor — Σ(full cells)/Σ(actual cells) overproduction factor
  - a3_native_mass_balance_max_rel_dev — native (A+B) max relative deviation
  - a3_native_steady_ratio_rel_err — native late-time ratio relative error
  - a3_cosim_vs_native_totals_max_z — |z| of co-sim vs native totals disagreement
  - a3_cosim_vs_native_profile_max_z — |z| of co-sim vs native profile disagreement
  - a3_wall_time_s — wall-clock time of the full run

parent_studies:
- field-modulated-decay

question: |
  When molecules move both ways between particle and field representations (A_particle
  → B_field and B_field → A_particle by field-dependent creation), is total A + B
  conserved and is the right steady state reached? Do both solvers agree?
hypothesis: |
  Each side applies only its own half of each mixed reaction, so A + B is conserved in
  expectation up to the O(dt) lag of the explicit coupling, and total A / total B → k2 / k1.
  Field-dependent creation must use each grid node's actual cell volume (1/2–1/8 at
  boundaries); otherwise creation is overproduced by Σ(full cells)/Σ(actual cells).
objective: |
  11×11×3 slab (10×10×1 µm); k1 = 1 s⁻¹, k2 = 0.5 s⁻¹; B₀ = 0.2 µM (12,044 molecules);
  D_A = D_B = 1; dt = 0.01; t = 5 s; 16 seeds per solver. Measured:
  - mass balance and steady-state ratio;
  - co-sim vs native totals and profiles;
  - a creation-only experiment (B a static catalyst, 2 s, 8 seeds), comparing created
    A with the exact expectation k2·[B]·V·602.214·t.
description: |
  This study found two defects in Smoldyn's grid-based 0th-order creation (the
  OPTION_VCELL path), both now fixed in our fork (virtualcell/Smoldyn pyhybrid):
  1. **Full-cell volume:** the count used the full cell volume at boundary nodes, as in
     vcell-fvsolver's embedded Smoldyn 2.38 (reported as virtualcell/vcell-fvsolver#24).
  2. **Skipped boundary nodes:** nodes on the domain walls failed the geometric
     compartment test, so boundary cells never produced. VCell's voxel-map compartments
     avoid this.
  A remaining Smoldyn start-up artifact skips creation for about the first 2 steps
  (about 1% over 2 s).
  The native solver still has defect 1, so it does not conserve mass here. This study
  quantifies the native bias rather than masking it.

baseline:
- name: two-way-exchange-slab
  composite: viva_pde_particle.composites.examples.two_way_exchange
  params:
    k1: 1.0
    k2: 0.5
    b0: 0.2
    dt: 0.01

variants: []

# v4 Build-tab view (conditions.baseline + the arms this study actually ran).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.two_way_exchange
    params: {k1: 1.0, k2: 0.5, b0: 0.2, dt: 0.01}
  variants:
    - name: cosim-two-way
      diff_from_baseline: "Full two-way exchange on the 11×11×3 slab, 16 seeds, co-simulation solver (t=5 s)."
    - name: native-two-way
      diff_from_baseline: "Same model solved by the native VCell embedded hybrid (16 seeds) for solver comparison."
    - name: creation-only
      diff_from_baseline: "B a static catalyst (2 s, 8 seeds per solver); created A vs exact k2·[B]·V·602.214·t."

simulation_set:
  - name: default
    kind: baseline
    status: ran
    base_model: viva_pde_particle.composites.examples.two_way_exchange
    seeds: [0]
    metrics: [a3_cosim_mass_balance_max_rel_dev, a3_cosim_steady_ratio_rel_err, a3_cosim_creation_ratio, a3_native_creation_vs_bug_factor]
    pass_fail_tests: [cosim-conserves-mass, cosim-reaches-steady-state, cosim-creation-is-exact, native-overproduction-matches-boundary-volume-defect]
    description: "Two-way exchange (16 seeds/solver) + creation-only check (8 seeds/solver); results/metrics.json."

behavior_tests:
- name: cosim-conserves-mass
  classification: primary
  description: Max over time of |ensemble-mean (A + B) / initial − 1| for the co-simulation.
  measure:
    kind: derived_scalar
    field: a3_cosim_mass_balance_max_rel_dev
  pass_if:
    op: "<"
    value: 0.03
    provenance:
      kind: theory
      note: Conserved in expectation; the residual comes from the explicit-coupling lag plus the ~2-step creation start-up artifact.
  requires_simulation: two-way-exchange-slab
  status: pass
  gate_class: acceptance_criterion
- name: cosim-reaches-steady-state
  classification: primary
  description: Relative error of the late-time (t ≥ 4 s) ratio of total A to total B vs k2/k1 for the co-simulation.
  measure:
    kind: derived_scalar
    field: a3_cosim_steady_ratio_rel_err
  pass_if:
    op: "<"
    value: 0.03
    provenance:
      kind: theory
      note: Detailed balance of A ⇌ B; 16 seeds.
  requires_simulation: two-way-exchange-slab
  status: pass
  gate_class: acceptance_criterion
- name: cosim-creation-is-exact
  classification: primary
  description: Created A / exact expectation for the co-simulation (creation only, static B).
  measure:
    kind: derived_scalar
    field: a3_cosim_creation_ratio
  pass_if:
    op: range
    low: 0.97
    high: 1.02
    provenance:
      kind: theory
      note: Exact expectation k2·[B]·V·602.214·t; the lower slack covers the ~2-step start-up artifact.
  requires_simulation: two-way-exchange-slab
  status: pass
  gate_class: acceptance_criterion
- name: native-overproduction-matches-boundary-volume-defect
  classification: secondary
  description: >-
    Native created-A ratio divided by Σ(full cells)/Σ(actual cells), the predicted
    overproduction of vcell-fvsolver's full-volume boundary creation.
  measure:
    kind: derived_scalar
    field: a3_native_creation_vs_bug_factor
  pass_if:
    op: range
    low: 0.95
    high: 1.05
    provenance:
      kind: theory
      note: >-
        Characterizes the reported defect (virtualcell/vcell-fvsolver#24). This test will
        fail once the defect is fixed upstream; then replace it with a mass-balance test
        for the native solver.
  requires_simulation: two-way-exchange-slab
  status: pass
  gate_class: acceptance_criterion

canonical_runs:
- name: default
  script: workspace/studies/two-way-exchange/sims/run.py
  args: []
  label: "Two-way exchange (16 seeds per solver) + creation-only check (8 seeds per solver)"
  default: true

visualizations:
- name: two-way-exchange
  address: html:viz/two_way_exchange.html
  chart: viz/two_way_exchange.html
  render: "python sims/run.py"

conclusion: |
  Results (results/metrics.json, 2026-10-03):
  - **Co-simulation:** conserves A + B to 1.2%; steady-state ratio within 0.3% of k2/k1;
    creation at 0.994 of the exact expectation.
  - **Native VCell:** creation at 1.813× the expectation, matching the predicted
    boundary-volume overproduction (1.815×) to 0.1%. As a result A + B grows 177%
    in 5 s and the steady state is 51% off; the two solvers disagree strongly
    (|z| ~ 200).
  This is a defect in the embedded solver (virtualcell/vcell-fvsolver#24), not in the
  coupling method. With field-dependent creation the co-simulation is the more
  accurate of the two.

runs:
  - name: default
    emitter: json
    outcomes:
      cosim-conserves-mass: pass
      cosim-reaches-steady-state: pass
      cosim-creation-is-exact: pass
      native-overproduction-matches-boundary-volume-defect: pass

findings:
  - id: F-01
    tier: observation
    statement: >
      The co-simulation conserves mass and reaches the right steady state across the
      two-way handoff: ensemble-mean (A+B) stays within 1.18% of its initial value over
      5 s, and the late-time total-A/total-B ratio is within 0.32% of k2/k1 (16 seeds).
    claim_scope: behavioral
    generality: {axes_tested: [initial_conditions], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: cosim-conserves-mass}
    next_action: None — mass balance and detailed balance confirmed for the co-simulation.
    next_action_type: replicate
  - id: F-02
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      Field-dependent creation in the co-simulation is exact: created A is 0.994× the exact
      expectation k2·[B]·V·602.214·t (creation-only, static B), confirming that using each
      node's actual cell volume (1/2–1/8 at boundaries) removes the overproduction; the
      0.6% shortfall is the ~2-step Smoldyn creation start-up artifact.
    claim_scope: mechanism
    generality: {axes_tested: [initial_conditions], level: mechanism}
    provenance: {run_ids: [default]}
    evidence: {from_test: cosim-creation-is-exact}
    next_action: None — boundary-volume and skipped-node defects fixed in the Smoldyn fork.
    next_action_type: replicate
  - id: F-03
    tier: interpretation
    statement: >
      The native VCell embedded solver diverges strongly and the divergence is fully
      explained by a known defect: native creation is 1.813× the expectation, matching the
      predicted full-volume boundary overproduction Σ(full)/Σ(actual)=1.815× to 0.1%
      (ratio 0.999). As a consequence native (A+B) grows 177% in 5 s and its steady-state
      ratio is 51% off, so the two solvers disagree at |z| ≈ 219 (totals) / 153 (profile).
      This is vcell-fvsolver's bug (virtualcell/vcell-fvsolver#24), not the coupling method.
    claim_scope: mechanism
    generality: {axes_tested: [alt_implementation], level: mechanism}
    provenance: {run_ids: [default]}
    evidence: {from_test: native-overproduction-matches-boundary-volume-defect}
    next_action: >
      Carry the boundary-volume fix upstream to vcell-fvsolver; once fixed, replace this
      characterization test with a native mass-balance test.
    next_action_type: escalate_model

conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all three primary
      co-sim tests pass (mass balance 1.18%, steady ratio 0.32%, creation 0.994×), and the
      secondary native-defect characterization passes (0.999).
  biological_validation:
    basis: >
      Theoretical targets met: A+B conservation in expectation, detailed-balance steady
      state at k2/k1, and the exact field-dependent creation rate k2·[B]·V·602.214·t for
      the co-simulation.
  explanatory_gain:
    basis: >
      Separates coupling from engine defect: the co-simulation is exact, while the native
      solver's 1.813× creation is quantitatively explained by full-volume boundary
      overproduction (predicted 1.815×), isolating the bug to vcell-fvsolver#24.

conclusion_logic:
  if_primary_tests_pass: >
    The co-simulation conserves A+B (1.18%), reaches the k2/k1 steady state (0.32%), and
    gets field-dependent creation exactly right (0.994×), so the two-way particle↔field
    handoff is correct when each node's actual cell volume is used. The native solver's
    strong divergence is a characterized engine defect (vcell-fvsolver#24), not a coupling
    failure — carry the boundary-volume fix upstream.
  if_primary_tests_fail: >
    A co-sim mass deviation ≥ 3%, a steady-ratio error ≥ 3%, or a creation ratio outside
    [0.97, 1.02] would mean the coupling itself overproduces or loses molecules across the
    handoff — re-examine the per-node cell-volume accounting and the explicit-coupling lag
    before attributing any divergence to the native engine.

report:
  confidence: high
  evidence_quality: calibrated
  caveat: >
    The native VCell arm intentionally carries defect #24 (full-volume boundary creation)
    and so does not conserve mass; this study quantifies that bias rather than masking it,
    and the native arm needs the dev pixi env.

reproducibility:
  level: L3   # scripted, committed inputs + metrics; native arm needs the dev env
  rerun:
    - cmd: "pixi run -e dev python workspace/studies/two-way-exchange/sims/run.py"
      produces: [results/metrics.json, viz/two_way_exchange.html]
      note: >
        Two-way exchange (16 seeds/solver) + creation-only check (8 seeds/solver). The
        native VCell arm needs the dev pixi env; in the default env only the co-sim arm runs.
  inputs_committed: [results/metrics.json]
  wall_time_s: 8.243252277374268
