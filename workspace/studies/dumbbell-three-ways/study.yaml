conclusion: |
  Results (results/metrics.json, 2026-10-04). The analytic cell volume is 28.11 µm³ (Monte Carlo).

  **Geometry:**
  - VCell's staircase is −1.6%.
  - VCell's smooth membrane is **−12.4%**: smoothing shrinks the thin neck and the small lobes.
  - The Netgen mesh (h = 0.3) is −3.0%.

  | path | near-membrane bias (z) | lobe asym (z) | conversion | exchange | steady ratio err |
  |---|---|---|---|---|---|
  | native VCell | −0.81% (−118) | +0.07% (0.2) | −0.65% | **−25.9%** | 8.9% |
  | co-sim, VCell geometry, none | −0.74% (−43) | +0.15% (0.4) | +0.06% | **−18.2%** | 7.8% |
  | co-sim, VCell geometry, adapters+volumes | −0.02% (−1.2) | +0.33% (0.9) | +0.06% | −0.07% | 0.39% |
  | co-sim, Netgen mesh | +0.04% (2.8) | +0.60% (1.9) | +0.34% | −0.12% | 0.61% |

  - **On a thin-necked shape the uncorrected smooth-vs-staircase mismatch is severe.** Native VCell
    loses a quarter of A + B in exchange and misses the steady ratio by 9%.
    - The co-sim with VCell's own volumes (`none`) isolates the volume effect: −18.2%.
    - The rest of the native loss is consistent with the binning (vcell-fvsolver#25) and creation
      (#26) defects measured on the ball.
  - **The accessible-volume correction removes it entirely.** Exchange is −0.07%, the near-membrane
    bias is gone and the steady ratio is accurate, on exactly VCell's geometry.
  - **The body-fitted Netgen path** is also conservative and unbiased. Its slight lobe asymmetry
    (0.6%, z = 1.9) is borderline at 16 seeds.
  - One description drove all four paths; no solver-specific geometry code was needed.

runs:
- name: default
  emitter: json
  outcomes:
    corrected-exchange-conserves: pass
    corrected-near-membrane-unbiased: pass
    mesh-exchange-conserves: pass
    native-exchange-conserves: fail

findings:
- id: F-01
  tier: observation
  statement: >
    The accessible-volume correction keeps the co-sim conservative and unbiased on exactly
    VCell's thin-necked geometry: exchange A+B balance is -0.07% (±1.5% band) and the
    near-membrane bias is -0.02% (z = -1.2, ±0.5% band), with the steady ratio off by 0.39%.
  claim_scope: behavioral
  generality: {axes_tested: [geometry], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: corrected-exchange-conserves}
  next_action: None — the corrected co-sim path is conservative on the dumbbell.
  next_action_type: replicate
  kind: computational
  status: contradicts
- id: F-02
  tier: observation
  statement: >
    The body-fitted Netgen mesh path is also conservative: exchange balance is -0.12%
    (±1.5% band) with a +0.04% near-membrane bias, against a -3.0% mesh cell-volume error.
  claim_scope: behavioral
  generality: {axes_tested: [geometry, alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: mesh-exchange-conserves}
  next_action: Lobe asymmetry (+0.60%, z = 1.9) is borderline at 16 seeds; add seeds if it matters.
  next_action_type: replicate
  kind: computational
  status: contradicts
- id: F-03
  tier: mechanism
  mechanism_origin: observed
  statement: >
    On a thin-necked shape the uncorrected smooth-vs-staircase mismatch is severe and the
    native path fails the band: native VCell loses -25.9% of A+B in exchange and misses the
    steady ratio by 8.9%, driven by the -12.4% smooth-membrane volume error that shrinks the
    neck and small lobes. The co-sim with VCell's own volumes (`none`) isolates the volume
    effect at -18.2%; the rest is consistent with the binning (vcell-fvsolver#25) and creation
    (#26) defects.
  claim_scope: mechanism
  generality: {axes_tested: [geometry, alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: native-exchange-conserves}
  next_action: Carry the volume correction and the   #25/#26 fixes upstream into VCell.
  next_action_type: escalate_model

  kind: computational
  status: contradicts
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all three primary
      tests pass. The native-path secondary test fails by design (-25.9% exchange), documenting
      the smooth-vs-staircase defect on a thin-necked shape.
  biological_validation:
    basis: >
      Not a biological claim: a numerical-coupling study on a synthetic dumbbell. E[B] is
      spatially uniform, so the balance and near-membrane bands are the physical acceptance
      criteria, which the corrected and mesh paths meet (-0.07% and -0.12% exchange).
  explanatory_gain:
    basis: >
      F-03 decomposes the native -25.9% loss into a -18.2% volume component (isolated by the
      `none` arm) and the residual binning/creation defects, and shows one GeometryDescription
      drives all four solver paths with no solver-specific geometry code.
conclusion_logic:
  if_primary_tests_pass: >
    The accessible-volume correction and the body-fitted Netgen mesh both stay conservative and
    unbiased on a thin-necked, non-convex shape — one description drives every path. Carry the
    volume correction and the vcell-fvsolver#25/#26 fixes upstream.
  if_primary_tests_fail: >
    A corrected-path or mesh-path exchange balance outside ±1.5%, or a near-membrane bias
    outside ±0.5%, would mean the correction does not generalize off the sphere — re-examine the
    accessible-volume adapters and the Netgen realization before trusting the paths.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: theory-matched
  caveat: >
    E[B] is assumed spatially uniform for the bias bands. The native-path secondary test fails
    by design to keep the smooth-vs-staircase defect visible. The native arm needs the dev env;
    the mesh-path lobe asymmetry is borderline at 16 seeds.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/dumbbell-three-ways/sims/run.py"
    produces: [results/metrics.json, viz/dumbbell_three_ways.html]
    note: >
      Native VCell (8 seeds) + three co-sim paths (16 seeds each). Needs the dev pixi env
      (pyvcell spatial-hybrid, patched Smoldyn). In the default env only the co-sim paths run.
  - cmd: "pixi run -e dev python workspace/studies/dumbbell-three-ways/sims/render_3d.py record && pixi run python workspace/studies/dumbbell-three-ways/sims/render_3d.py render"
    produces: [viz/dumbbell_3d.png, viz/dumbbell_3d_movie.gif, viz/dumbbell_3d_interactive.html]
    note: Record 3D bundles in the dev env; render figures in the default env (PyVista).
  inputs_committed: [results/metrics.json]
  wall_time_s: 330.48261284828186
