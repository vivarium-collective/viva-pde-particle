schema_version: 4
name: dumbbell-three-ways
title: "One non-convex GeometryDescription, three solver paths: native VCell, co-sim on VCell's geometry, co-sim on a Netgen mesh"
investigation: hybrid-generalizability
created: '2026-10-04'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Accepted

# What the study measures (anchors for the test rows / report).
readouts:
- name: b2f_vcell_corrected_exchange_balance
  description: A+B balance at 5 s, co-sim on VCell's geometry with adapters+volumes
- name: b2f_vcell_corrected_band_bias
  description: near-membrane B bias, corrected co-sim (E[B] uniform)
- name: b2f_mesh_exchange_balance
  description: A+B balance at 5 s, co-sim on the Netgen mesh
- name: b2f_native_exchange_balance
  description: A+B balance at 5 s, native VCell (documents the smooth-vs-staircase mismatch)
- name: b2f_volume_vcell_smooth_rel
  description: VCell smooth-membrane cell-volume error vs the analytic shape
parent_studies:
- vcell-geometry-cosim

question: |
  Phase 7e end to end on a non-sphere: does one geometry description drive the native VCell solver
  and both co-simulation paths, and do the accessible-volume correction and the body-fitted mesh
  stay unbiased and conservative on a thin-necked, non-convex shape?
hypothesis: |
  The ball's ~1.8% smooth-vs-staircase mismatch grows with surface-to-volume ratio and thin
  features, so the uncorrected paths (native VCell; the co-sim with `none`) should degrade much
  more on a dumbbell. `adapters+volumes` and the Netgen mesh should stay at the coupling-lag level.
objective: |
  A vcell-fenics GeometryDescription: two balls (R = 1.5 µm, centres 2.8 µm apart) joined by a
  neck (radius 0.6 µm), in an 8 × 6 × 6 µm box, Δ = 0.25 µm (33 × 25 × 25 grid). The four paths:
  - **native:** the description converted to VCML; vcell-fvsolver with embedded Smoldyn; 8 seeds.
  - **vcell_none, vcell_corrected:** the co-simulation on VCell's own realization, with
    correction `none` or `adapters+volumes`; 16 seeds each.
  - **mesh:** the co-simulation on a Netgen tet mesh (h = 0.3); 16 seeds.

  Cases and measures:
  - conversion (k = 0.5, 20,000 A uniform; 2 s): A + B balance; near-membrane bias (mean B within
    0.5 µm of the membrane against deeper B; E[B] is uniform); lobe asymmetry;
  - exchange (k1 = 1, k2 = 0.5, B₀ = 0.2 µM; 5 s): A + B balance and the steady ratio.
description: |
  Shows that one description drives every path: `to_vcml_geometry` for the native solver,
  `VCellFVRealization` for the co-sim on VCell's geometry, and `realize_fenics` (Netgen) for the
  mesh path. The native runners now pass `geometry`, `region` and `domain_volume` through
  (`run_native`, `run_native_ensemble`).

  Each method's B is measured on its own PDE volumes. The membrane distance is taken from the
  Netgen surface, the closest to the analytic shape.

baseline:
- name: dumbbell
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params: {}
  note: Built in sims/run.py from one GeometryDescription for all four paths.

variants: []

# v4 Build-tab view (conditions.baseline + the four solver paths as variants).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.bimolecular_hybrid
    params: {}
  variants:
  - name: native
    diff_from_baseline: "The GeometryDescription converted to VCML; vcell-fvsolver with embedded Smoldyn; 8 seeds."
  - name: vcell_none
    diff_from_baseline: "Co-sim on VCell's own realization, correction `none`; 16 seeds."
  - name: vcell_corrected
    diff_from_baseline: "Co-sim on VCell's own realization, correction `adapters+volumes`; 16 seeds."
  - name: mesh
    diff_from_baseline: "Co-sim on a Netgen tet mesh (h = 0.3); 16 seeds."

simulation_set:
- name: default
  kind: baseline
  status: ran
  base_model: viva_pde_particle.composites.examples.bimolecular_hybrid
  seeds: [0]
  metrics: [b2f_vcell_corrected_exchange_balance, b2f_mesh_exchange_balance, b2f_native_exchange_balance, b2f_vcell_corrected_band_bias]
  pass_fail_tests: [corrected-exchange-conserves, corrected-near-membrane-unbiased, mesh-exchange-conserves, native-exchange-conserves]
  description: "Dumbbell: native VCell + co-sim on VCell geometry (none/corrected) + co-sim on Netgen mesh; results/metrics.json."

behavior_tests:
- name: corrected-exchange-conserves
  classification: primary
  description: A + B balance at 5 s, co-sim on VCell's geometry with adapters+volumes.
  measure:
    kind: derived_scalar
    field: b2f_vcell_corrected_exchange_balance
  pass_if:
    op: range
    low: -0.015
    high: 0.015
    provenance:
      kind: theory
      note: First-order coupling error only.
  requires_simulation: dumbbell
  status: pass
  gate_class: acceptance_criterion
- name: corrected-near-membrane-unbiased
  classification: primary
  description: Near-membrane B bias, co-sim on VCell's geometry with adapters+volumes.
  measure:
    kind: derived_scalar
    field: b2f_vcell_corrected_band_bias
  pass_if:
    op: range
    low: -0.005
    high: 0.005
    provenance:
      kind: theory
      note: E[B] is spatially uniform.
  requires_simulation: dumbbell
  status: pass
  gate_class: acceptance_criterion
- name: mesh-exchange-conserves
  classification: primary
  description: A + B balance at 5 s, co-sim on the Netgen mesh.
  measure:
    kind: derived_scalar
    field: b2f_mesh_exchange_balance
  pass_if:
    op: range
    low: -0.015
    high: 0.015
    provenance:
      kind: theory
      note: The particle domain is the mesh (B2d).
  requires_simulation: dumbbell
  status: pass
  gate_class: acceptance_criterion
- name: native-exchange-conserves
  classification: secondary
  description: >-
    A + B balance at 5 s, native VCell. Expected to FAIL; it documents the smooth-vs-staircase
    mismatch plus the vcell-fvsolver#25/#26 defects on a thin-necked shape.
  measure:
    kind: derived_scalar
    field: b2f_native_exchange_balance
  pass_if:
    op: range
    low: -0.015
    high: 0.015
    provenance:
