schema_version: 4
name: sphere-cosim-vs-native
title: "Same ball, two discretizations: native VCell (Cartesian + membrane numerics) vs co-simulation (body-fitted P1)"
investigation: hybrid-generalizability
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Reported

# What the study measures (anchors for the test rows / report).
readouts:
- name: b2b_native_staircase_volume_rel_err
  description: rel. volume error of VCell's Cartesian ball representation
- name: b2b_cosim_mesh_volume_rel_err
  description: rel. volume error of the co-sim body-fitted mesh at h = 0.8 µm
- name: b2b_conversion_survival_max_z
  description: max two-sample |z| of surviving A, co-sim vs native (conversion)
- name: b2b_final_radial_b_rel_diff
  description: max rel. difference of the final radial B profiles (8 shells)
- name: b2b_exchange_a_totals_max_z
  description: max two-sample |z| of total A, co-sim vs native (exchange)
- name: b2b_native_exchange_mass_balance_final_signed
  description: native signed A + B mass balance at t (exchange)
- name: b2b_exchange_native_minus_cosim_a_final_rel
  description: native final A relative to co-sim (exchange)
- name: b2b_native_exchange_a_binned_outside_cell_frac
  description: fraction of native A binned to nodes outside the cell
parent_studies:
- unstructured-geometry

question: |
  On a curved domain (a ball), how do the native VCell hybrid and the co-simulation compare?
  - Native VCell uses analytic geometry on its Cartesian volume grid: the membrane is a
    staircase geometrically, but numerically uses local tangent-plane projections and
    Voronoi neighbours.
  - The co-simulation uses a body-fitted P1 mesh coupled through a background grid.
hypothesis: |
  Both are consistent discretizations of the same problem, so they should agree to within
  sampling plus discretization error. VCell's geometry handling is mature, and the
  comparison measures which discretization represents this geometry and coupling better at
  comparable resolution.
objective: |
  Box [0, 9]³ with Δ = 0.25 µm (37³). Ball centre (4.5, 4.5, 4.5), R = 4 µm, 0.5 µm clear of
  the box walls, so the box-wall creation defect (vcell-fvsolver#24) cannot act.
  Co-sim mesh h = 0.8 µm. 8 seeds per solver.
  - Conversion A_p → B_f (k = 0.5 /s, 20,000 A).
  - Exchange A_p ⇌ B_f with field-dependent creation in the cell (k1 = 1, k2 = 0.5, B₀ = 0.2 µM).

baseline:
- name: ball-both-solvers
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params: {}
  note: >-
    Built in sims/run.py: build_mesh_hybrid_document (co-sim) and
    run_native_ensemble(geometry={"kind": "sphere", ...}) (native).

variants: []

