  requires_simulation: ball-both-solvers
  status: pass
  gate_class: acceptance_criterion
- name: exchange-agrees
  classification: secondary
  description: >-
    Max two-sample |z| of total A, co-sim vs native, exchange case. FAILS: native loses
    6.8% at the curved membrane (exterior binning plus centre-only creation in vcell-fvsolver).
    See the conclusion.
  measure:
    kind: derived_scalar
    field: b2b_exchange_a_totals_max_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
