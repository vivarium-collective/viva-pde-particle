conclusion: |
  Results (results/metrics.json, 2026-10-03). Re-run after Study B2d with:
  - the co-sim default membrane="mesh" (Smoldyn confined by the PDE mesh's boundary
    triangles);
  - the Smoldyn-fork fix for field-dependent creation in curved compartments.
  The native results are unchanged.

  **Geometry.** VCell's representation of the ball is more accurate at this resolution:
  −0.47% volume error, against −1.4% for the co-sim mesh at h = 0.8 µm.

  **Conversion: the solvers agree.** Both decay as exp(−kt) (|z| ≤ 1.5) and conserve
  A + B to under 1% (native −0.57%, co-sim +0.66%). Survival agrees (|z| = 1.5), and the
  final radial B profiles agree to 3.3%.

  **Exchange: the native solver loses molecules at the curved membrane.**
  - Signed mass balance at t = 5 s: native −6.8%; co-sim +0.51%, its first-order coupling
    error and within the box-domain level.
  - Native total A ends 8.1% below the co-sim (|z| = 12).
  - An earlier version of this study read the unsigned deviation as growth; that was wrong.
  - Two native mechanisms account for the loss. Their rough budget, about −1.6% plus
    −5 to −6%, matches the observed −6.8%:
    1. **Exterior binning:**
       - 1.2% of native A is binned to grid nodes outside the voxelized cell, where B is not
         solved, so their PDE source k1·[A] is dropped.
       - B2c localizes this as a −2.3% outer-shell depletion.
       - In vcell-fvsolver, VCellSmoldynOutput::computeHistogram bins to the nearest node.
         Its same-compartment correction is commented out.
    2. **Creation deficit:**
       - Field-dependent creation in the cell runs at 0.960 of the exact expectation.
       - Study B2d found the mechanism in Smoldyn's hybrid zeroreact: it draws only in grid
         cells whose centre is inside the compartment, so cells that partly overlap a curved
         compartment never create. Monte Carlo on this geometry gives 0.976 for that rule.
       - Our Smoldyn fork now draws in every cell and thins exactly. VCell's vendored
         Smoldyn 2.38 still has the centre test.
  - The co-sim had both effects before B2d (creation 0.974, exchange −1.2%); with the fixes,
    neither remains.
  - These are hybrid-coupling details at curved membranes, not a limitation of VCell's
    geometry or PDE numerics. Native-side fixes: re-enable the same-compartment binning
    correction, and draw creation in every cell overlapping the compartment.

runs:
- name: default
  emitter: json
  outcomes:
    native-represents-ball-volume:
      result: PASS
    conversion-agrees:
      result: PASS
    conversion-field-profiles-agree:
      result: PASS
    exchange-agrees:

      result: FAIL
findings:
- id: F-01
  tier: observation
  statement: >
    At this resolution VCell's Cartesian representation of the ball is the more accurate
    geometry: −0.47% volume error (b2b_native_staircase_volume_rel_err = −0.0047) against −1.4%
    for the co-sim body-fitted mesh at h = 0.8 µm (b2b_cosim_mesh_volume_rel_err = −0.0139).
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: native-represents-ball-volume}
  next_action: None — both representations are within a few percent of the ball volume.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: observation
  statement: >
    For the conversion case the two discretizations agree: surviving A matches to max
    two-sample |z| = 1.47 (b2b_conversion_survival_max_z) and the final radial B profiles agree
    to 3.3% (b2b_final_radial_b_rel_diff = 0.0330, under the 5% band), with both solvers
    conserving A + B to under 1%.
  claim_scope: behavioral
  generality: {axes_tested: [discretization, alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: conversion-agrees}
  next_action: None — first-order conversion agrees across discretizations.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: mechanism
  mechanism_origin: discovered
  statement: >
    The exchange case diverges and fails its band: total A differs at max two-sample |z| = 12.1
    (b2b_exchange_a_totals_max_z, band < 4.0), with native A ending 8.1% below the co-sim
    (b2b_exchange_native_minus_cosim_a_final_rel = −0.0808) and native signed mass balance at
    −6.8% (b2b_native_exchange_mass_balance_final_signed = −0.0681) against the co-sim's +0.51%.
    Two native mechanisms at the curved membrane account for it: exterior binning (1.2% of A
    binned to nodes outside the voxelized cell, b2b_native_exchange_a_binned_outside_cell_frac =
    0.0118, so their PDE source is dropped) and a field-dependent creation deficit (Smoldyn's
    centre-inside test skips cells that partly overlap the curved compartment). Native fixes:
    re-enable the same-compartment binning correction (vcell-fvsolver#25) and draw creation in
    every overlapping cell.
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: exchange-agrees}
  next_action: >
    Land the two native vcell-fvsolver/Smoldyn fixes and re-run the exchange case; the co-sim
    already loses neither effect after B2d.
  next_action_type: escalate_model

  kind: computational
  status: contradicts
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; the geometry and
      conversion tests pass, and the exchange failure is a pinned, intentional marker of the
      native curved-membrane mass loss.
  biological_validation:
    basis: >
      Both discretizations reproduce first-order conversion in the ball (|z| = 1.47, radial B to
      3.3%); only the field-dependent exchange exposes the native boundary loss.
  explanatory_gain:
    basis: >
      F-03 decomposes the native −6.8% exchange loss into exterior binning (1.2% of A outside the
      cell) and a creation deficit at the curved membrane, each with a concrete solver fix, and
      shows the co-sim carries neither after B2d.
conclusion_logic:
  if_primary_tests_pass: >
    The two discretizations agree for conversion (survival |z| = 1.47, radial B to 3.3%), so the
    co-simulation represents this curved geometry and coupling as well as native VCell. The
    exchange divergence is a native curved-membrane coupling artifact — pursue the vcell-fvsolver
    binning and creation fixes.
  if_primary_tests_fail: >
    A conversion survival |z| ≥ 4 or radial-B difference ≥ 5% would mean the discretizations
    disagree even on first-order kinetics — re-examine the mesh resolution and the background-grid
    coupling before attributing the exchange loss to the native membrane handling.

report:
  confidence: medium
  evidence_quality: theory-matched
  caveat: >
    The exchange test fails by design (native −6.8% mass loss at the curved membrane, |z| = 12.1)
    to keep the open native discrepancy visible; it marks two vcell-fvsolver/Smoldyn issues, not a
    study defect. Native and 3D arms need the dev pixi env.

reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/sphere-cosim-vs-native/sims/run.py"
    produces: [results/metrics.json, viz/sphere_cosim_vs_native.html]
    note: >
      Ball, native VCell vs co-sim, conversion + exchange, 8 seeds each. The native arm needs
      the dev pixi env (pyvcell spatial-hybrid) and the patched Smoldyn.
  - cmd: "pixi run -e dev python workspace/studies/sphere-cosim-vs-native/sims/render_3d.py record && pixi run python workspace/studies/sphere-cosim-vs-native/sims/render_3d.py render"
    produces: [viz/sphere_3d_conversion.png, viz/sphere_3d_exchange.png, viz/sphere_3d_movie.gif, viz/sphere_3d_interactive.html]
    note: Record 3D bundles in the dev env; render figures in the default env (PyVista / three.js).
  inputs_committed: [results/metrics.json]
  wall_time_s: 922.4
