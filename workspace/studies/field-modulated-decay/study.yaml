schema_version: 4
name: field-modulated-decay
title: Field-to-particle coupling, A_particle -> 0 at rate k·[B](x)
investigation: cosim-vs-embedded-hybrid
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Accepted
parent_studies:
- handoff-units-and-binning

# What the study measures (anchors for the test rows / report).
readouts:
- name: a2_static_field_max_abs_z
  description: max |z| over x-columns of survivors vs N0·exp(-k·B·t) (static B)
- name: a2_zero_field_decays
  description: molecules lost from the B = 0 column (must be 0)
- name: a2_continuum_rel_l2_err
  description: relative L2 of ensemble-mean A vs the continuum FV solution
- name: a2_continuum_total_rel_err
  description: relative error of ensemble-mean total A vs continuum
- name: a2_native_static_field_max_abs_z
  description: native VCell hybrid, static-B column survival |z|
- name: a2_cosim_vs_native_static_survival_z
  description: co-sim vs native static-field survival |z|
- name: a2_cosim_vs_native_diffusing_profile_z
  description: co-sim vs native diffusing final x-profile |z|
- name: a2_cosim_vs_native_diffusing_survival_rel_diff
  description: co-sim vs native total survival (relative)
question: |
  Does the Smoldyn process read the PDE field at each molecule as vcell-fvsolver does
  (nearest node, value from the previous coupling step)? Does the coupled model approach
  its deterministic continuum limit?
hypothesis: |
  With a static field and immobile particles, each grid column survives as exp(-k·B·t)
  exactly in expectation, and nothing decays where B = 0. With diffusing A and B, the
  ensemble-mean particle concentration matches the all-continuous FV solution of the same
  model, to within sampling noise.
objective: |
  Part 1: B rises linearly from 0 to 1 µM across x; 4,000 immobile A per run; k = 1/(µM·s);
  8 seeds; t = 1 s. Compare per-column survival to exp(-k·B_col·t) with binomial z-scores.
  Part 2: B is a Gaussian (1 µM peak, D_B = 0.5); 20,000 A with D_A = 1; 8 seeds. Compare
  the ensemble-mean A (µM) at t = 1 s to continuum_model() solved by FVReactionDiffusion
  alone (relative L2 over the grid, and total A).
description: |
  The reaction is written once in the HybridModel (A + B -> B, k). partition() sends the
  PDE side nothing (B is a catalyst), and sends the particle side A -> 0 with the rate
  k*B; that Smoldyn evaluates through GridValueProvider at each molecule's nearest node.
  Coupling is coupling: fvsolver with k = 1 (dt = 0.01).

baseline:
- name: field-modulated-decay-baseline
  composite: viva_pde_particle.composites.examples.field_modulated_decay
  params:
    n_particles: 4000
    k: 1.0
    d_a: 0.0
    d_b: 0.0
    b_profile: linear
    dt: 0.01

variants:
- name: native-vcell-slab
  composite: viva_pde_particle.composites.examples.field_modulated_decay
  params:
    n_particles: 4000
    k: 1.0
    b_profile: linear
    dt: 0.01
  note: >-
    The same model on a quasi-2D slab (11x11x3), run by both the co-simulation (Poisson
    initial placement) and VCell's native hybrid solver via
    viva_pde_particle.reference.vcell_native (pyvcell -> libvcell -> vcell-fvsolver).
- name: continuum-limit
  composite: viva_pde_particle.composites.examples.field_modulated_decay
  params:
    n_particles: 20000
    k: 1.0
    d_a: 1.0
    d_b: 0.5
    b_profile: gaussian
    dt: 0.01

# v4 Build-tab view (conditions.baseline + the native-slab and continuum-limit arms).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.field_modulated_decay
    params: {n_particles: 4000, k: 1.0, d_a: 0.0, d_b: 0.0, b_profile: linear, dt: 0.01}
  variants:
  - name: native-vcell-slab
    diff_from_baseline: "Same model on a quasi-2D slab (11×11×3), run by both co-sim and VCell's native hybrid; 8 seeds each."
  - name: continuum-limit
    diff_from_baseline: "Gaussian B (D_B=0.5), 20,000 diffusing A (D_A=1), 8 seeds; compared to the all-continuous FV solution."

simulation_set:
- name: default
  kind: baseline
  status: ran
  base_model: viva_pde_particle.composites.examples.field_modulated_decay
  seeds: [0]
  metrics: [a2_static_field_max_abs_z, a2_zero_field_decays, a2_continuum_rel_l2_err, a2_cosim_vs_native_static_survival_z]
  pass_fail_tests: [survival-follows-local-field, no-decay-where-field-is-zero, approaches-continuum-limit, total-matches-continuum, native-vcell-follows-local-field, cosim-matches-native-static, cosim-matches-native-diffusing, cosim-matches-native-total]
  description: "Static-field column survival + continuum-limit comparison + native-slab agreement (8 seeds each); results/metrics.json."

behavior_tests:
- name: survival-follows-local-field
  classification: primary
  description: Max |z| over x-columns of survivors vs N0·exp(-k·B_col·t) (static B, immobile A).
  measure:
    kind: derived_scalar
    field: a2_static_field_max_abs_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Smoldyn's first-order reaction probability per step is 1-exp(-rate·dt), so survival is exp(-k·B·t) exactly in expectation.
  requires_simulation: field-modulated-decay-baseline
  status: pass
  gate_class: regression_pin
- name: no-decay-where-field-is-zero
  classification: primary
  description: Molecules lost from the B = 0 column.
  measure:
    kind: derived_scalar
    field: a2_zero_field_decays
  pass_if:
    op: "=="
    value: 0
    provenance:
      kind: theory
      note: Rate k·0 = 0 at the B = 0 nodes.
  requires_simulation: field-modulated-decay-baseline
  status: pass
  gate_class: regression_pin
- name: approaches-continuum-limit
  classification: primary
  description: Relative L2 error of the ensemble-mean A (µM) vs the continuum FV solution at t = 1 s.
  measure:
    kind: derived_scalar
    field: a2_continuum_rel_l2_err
  pass_if:
    op: "<"
    value: 0.06
    provenance:
      kind: theory
      note: Per-node sampling noise of the 8-run mean is about 1/sqrt(8·165), roughly 2.8%; the threshold allows about 2x that.
  requires_simulation: continuum-limit
  status: pass
  gate_class: regression_pin
- name: total-matches-continuum
  classification: secondary
  description: Relative error of the ensemble-mean total A vs the continuum total at t = 1 s.
  measure:
    kind: derived_scalar
    field: a2_continuum_total_rel_err
  pass_if:
    op: "<"
    value: 0.02
    provenance:
      kind: theory
      note: 160,000 total molecule samples give ~0.3% sampling error on the total.
  requires_simulation: continuum-limit
  status: pass
  gate_class: regression_pin

- name: native-vcell-follows-local-field
  classification: primary
  description: Native VCell hybrid, static B (slab, 8 seeds); max |z| over x-columns of survivors vs N0·exp(-k·B·t).
  measure:
    kind: derived_scalar
    field: a2_native_static_field_max_abs_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Same exact expectation as the co-simulation test; validates the headless native reference path.
  requires_simulation: native-vcell-slab
  status: pass
  gate_class: regression_pin
- name: cosim-matches-native-static
  classification: primary
  description: Two-sample max |z| over x-columns of per-run survival fractions, co-simulation vs native VCell (static B).
  measure:
    kind: derived_scalar
    field: a2_cosim_vs_native_static_survival_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Equal expected survival under both solvers; 8 runs each.
  requires_simulation: native-vcell-slab
  status: pass
  gate_class: regression_pin
- name: cosim-matches-native-diffusing
  classification: primary
  description: Two-sample max |z| over x-columns of the final A profile, co-simulation vs native VCell (diffusing A and B).
  measure:
    kind: derived_scalar
    field: a2_cosim_vs_native_diffusing_profile_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Same model, mesh and coupling scheme in both solvers; differences only from sampling (8 runs each).
  requires_simulation: native-vcell-slab
  status: pass
  gate_class: regression_pin
- name: cosim-matches-native-total
  classification: secondary
  description: Relative difference of mean total survival, co-simulation vs native VCell (diffusing A and B).
  measure:
    kind: derived_scalar
    field: a2_cosim_vs_native_diffusing_survival_rel_diff
  pass_if:
    op: "<"
    value: 0.02
    provenance:
      kind: theory
      note: 160,000 molecule samples per solver; sampling error ~0.5%.
  requires_simulation: native-vcell-slab
  status: pass
  gate_class: regression_pin

pipeline_gate:
  prerequisites:
  - handoff-units-and-binning
  enables:
  - two-way-exchange
  proceed_condition: The particle side reads fields correctly and the coupled model converges to its continuum limit.

canonical_runs:
- name: default
  script: workspace/studies/field-modulated-decay/sims/run.py
  args: []
  label: "Static-field column survival + continuum-limit comparison (8 seeds each)"
  default: true

visualizations:
- name: field-modulated-decay
  address: html:viz/field_modulated_decay.html
  chart: viz/field_modulated_decay.html
  render: "python sims/run.py"

conclusion: |
  All checks pass (results/metrics.json, 2026-10-03; re-run after the record-time fix).

  Co-simulation:
  - column survival vs exp(-k·B·t): max |z| = 1.56;
  - decays where B = 0: none;
  - ensemble-mean A vs continuum: 2.7% relative L2, at the sampling-noise level;
  - total A vs continuum: 0.05%.

  Co-simulation vs native VCell hybrid (quasi-2D slab 11×11×3, 8 seeds each, matched
  Poisson initial placement):
  - native column survival vs exp(-k·B·t): max |z| = 1.68;
  - co-sim vs native static-field survival: max |z| = 1.37;
  - B fields identical to 1e-16;
  - diffusing case, final x-profiles: max |z| = 2.54;
  - total survival differs by 0.04%.
  The two implementations are statistically indistinguishable on this model.

runs:
- name: default
  emitter: json
  outcomes:
    survival-follows-local-field: pass
    no-decay-where-field-is-zero: pass
    approaches-continuum-limit: pass
    total-matches-continuum: pass
    native-vcell-follows-local-field: pass
    cosim-matches-native-static: pass
    cosim-matches-native-diffusing: pass
    cosim-matches-native-total: pass

findings:
- id: F-01
  tier: observation
  statement: >
    The particle side reads the PDE field correctly: with static B and immobile A, per-
    column survival matches N0·exp(-k·B_col·t) with max |z| = 1.56 (co-sim) and 1.68
    (native VCell), both well under the |z| < 4 band, and exactly zero molecules decay
    in the B = 0 column.
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: survival-follows-local-field}
  next_action: None — field read confirmed against the exact expectation on both solvers.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: observation
  statement: >
    The coupled model converges to its deterministic continuum limit: with diffusing A
    and a Gaussian B, the ensemble-mean A is within 2.7% relative L2 (band 6%) and the
    total A within 0.05% (band 2%) of the all-continuous FV solution — both at the
    sampling-noise level.
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: approaches-continuum-limit}
  next_action: None.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    The co-simulation and VCell's native hybrid are statistically indistinguishable on
    this field-to-particle coupling: static-field survival agrees at max |z| = 1.37, the
    diffusing final x-profiles at |z| = 2.54, and total survival to 0.04%, with the B
    fields identical to 1e-16 — so GridValueProvider's nearest-node field read is
    reproduced by the process-bigraph decomposition.
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-matches-native-diffusing}
  next_action: >
    Clears the pipeline gate to two-way-exchange; no further action for this model.
  next_action_type: replicate

  kind: computational
  status: confirms
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all eight behavior
      tests pass (static |z|=1.56, native |z|=1.68, continuum L2 2.7%, cosim-vs-native
      profile |z|=2.54).
  biological_validation:
    basis: >
      Per-column survival matches the exact exp(-k·B·t) expectation (|z|=1.56) with no decay
      where B=0, and the coupled model converges to the continuum FV solution within 2.7% L2.
  explanatory_gain:
    basis: >
      F-03 shows the process-bigraph decomposition reproduces VCell's nearest-node
      GridValueProvider field read (B fields identical to 1e-16; survival/profile agreement
      within sampling), validating the headless native reference path.

conclusion_logic:
  if_primary_tests_pass: >
    The Smoldyn particle side reads the PDE field as vcell-fvsolver does (exact exp(-k·B·t)
    survival, no decay where B=0), the coupled model reaches its continuum limit within
    sampling, and the co-simulation and native VCell hybrid are statistically
    indistinguishable — clearing the pipeline gate to the two-way-exchange study.
  if_primary_tests_fail: >
    A static-field |z| ≥ 4, any decay in the B=0 column, a continuum L2 ≥ 6%, or a
    cosim-vs-native |z| ≥ 4 would mean the field read, units/binning or coupling diverged —
    re-examine partition() and GridValueProvider before advancing the pipeline.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: calibrated
  caveat: >
    Agreement bands are theory/sampling-based (8 seeds each), not literature-matched; the
    native-slab arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/field-modulated-decay/sims/run.py"
    produces: [results/metrics.json, viz/field_modulated_decay.html]
    note: >
      Static-field column survival + continuum-limit comparison + native-slab agreement
      (8 seeds each). The native-slab arm needs the dev pixi env (pyvcell spatial-hybrid);
      in the default env only the co-sim arms run.
  inputs_committed: [results/metrics.json]
  wall_time_s: 7.0801379680633545
