schema_version: 4
name: unstructured-geometry
title: Hybrid co-simulation with a body-fitted unstructured PDE mesh (ball)
investigation: hybrid-generalizability
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_reviewed
confidence: Accepted

# What the study measures (anchors for the test rows / report).
readouts:
  - b2_conversion_decay_max_z — max |z| over time of mean A against A₀·e^(−kt), conversion case
  - b2_conversion_mass_balance_max_rel_dev — max relative deviation of mean (A + B) from the initial total
  - b2_conversion_b_vs_continuum_rel_l2 — mesh-weighted relative L2 of mean B against the continuum FEM at t = 2 s
  - b2_exchange_steady_ratio_rel_err — relative error of the late-time A/B ratio against k2/k1
  - b2_exchange_mass_balance_max_rel_dev — max relative (A + B) deviation, exchange case
  - b2_mesh_volume_rel_err — polyhedral mesh volume vs the exact ball (geometry-representation error)
  - b2_wall_time_s — wall-clock time of the run

parent_studies:
- fenicsx-same-problem

question: |
  Can the co-simulation use a body-fitted unstructured mesh for the PDE half of a curved
  domain, as an alternative to VCell's own Cartesian volume grid with staircase-membrane
  numerics, while keeping the particle ↔ field handoff conservative and accurate?
hypothesis: |
  The PDE runs as P1 on a gmsh tetrahedral mesh of a ball, and Smoldyn runs inside a
  reflecting sphere. They couple through a fine background grid with one sparse matrix P:
  fields are interpolated as P·u, and particle loads are Pᵀ·counts. P's rows sum to 1, so
  the handoff conserves molecules exactly. The only residual is the mismatch between the
  particle side's geometry (exact sphere) and the PDE side's (polyhedral mesh, −1.4%
  volume).
objective: |
  Ball R = 4 µm; mesh h = 0.8 µm; background grid 33³ with Δ = 0.25 µm; dt = 0.01; 8 seeds.
  - Conversion A_p → B_f (k = 0.5 /s, 20,000 A): A against exp decay, A + B conservation,
    and B against the continuum FEM solution.
  - Exchange A_p ⇌ B_f with field-dependent creation inside the spherical compartment
    (k1 = 1, k2 = 0.5, B₀ = 0.2 µM): mass balance and the steady ratio k2/k1.

baseline:
- name: ball-conversion
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params: {}
  note: >-
    Built with viva_pde_particle.composites.hybrid.build_mesh_hybrid_document (sims/run.py);
    no workbench composite generator is registered for mesh geometries yet.

variants: []

# v4 Build-tab view (conditions.baseline + the two reaction arms as variants).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.bimolecular_hybrid
    params: {R_um: 4.0, mesh_h_um: 0.8, grid: 33, dx_um: 0.25, dt: 0.01, seeds: 8}
  variants:
    - name: conversion-arm
      diff_from_baseline: "A_p → B_f (k = 0.5 /s, 20,000 A): decay, A + B conservation, B vs continuum FEM."
    - name: exchange-arm
      diff_from_baseline: "A_p ⇌ B_f with field-dependent creation in the sphere (k1 = 1, k2 = 0.5, B₀ = 0.2 µM): balance + steady ratio."

simulation_set:
  - name: default
    kind: baseline
    status: ran
    base_model: viva_pde_particle.composites.examples.bimolecular_hybrid
    seeds: [0]
    metrics: [b2_conversion_decay_max_z, b2_conversion_mass_balance_max_rel_dev, b2_conversion_b_vs_continuum_rel_l2, b2_exchange_steady_ratio_rel_err]
    pass_fail_tests: [particle-decay-exact-in-ball, handoff-conserves-in-ball, field-matches-continuum-in-ball, exchange-steady-state-in-ball]
    description: "Ball (R = 4 µm, unstructured P1): conversion + exchange, 8 seeds each; results/metrics.json."

behavior_tests:
- name: particle-decay-exact-in-ball
  classification: primary
  description: Max |z| over time of the mean A against A₀·e^(−kt).
  measure:
    kind: derived_scalar
    field: b2_conversion_decay_max_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: A first-order reaction is unaffected by geometry.
  requires_simulation: ball-conversion
  status: pass
  gate_class: acceptance_criterion
- name: handoff-conserves-in-ball
  classification: primary
  description: Max relative deviation of mean (A + B) from the initial total, conversion case.
  measure:
    kind: derived_scalar
    field: b2_conversion_mass_balance_max_rel_dev
  pass_if:
    op: "<"
    value: 0.02
    provenance:
      kind: theory
      note: Pᵀ conserves counts exactly; the residual is explicit-coupling lag plus sampling.
  requires_simulation: ball-conversion
  status: pass
  gate_class: acceptance_criterion
- name: field-matches-continuum-in-ball
  classification: primary
  description: Relative L2 (mesh-weighted) of mean B against the continuum FEM solution at t = 2 s.
  measure:
    kind: derived_scalar
    field: b2_conversion_b_vs_continuum_rel_l2
  pass_if:
    op: "<"
    value: 0.05
    provenance:
      kind: theory
      note: 20,000 particles over 643 DOFs, 8 seeds.
  requires_simulation: ball-conversion
  status: pass
  gate_class: acceptance_criterion
- name: exchange-steady-state-in-ball
  classification: primary
  description: Relative error of the late-time ratio of total A to total B against k2/k1.
  measure:
    kind: derived_scalar
    field: b2_exchange_steady_ratio_rel_err
  pass_if:
    op: "<"
    value: 0.05
    provenance:
      kind: theory
      note: Detailed balance; field-dependent creation inside the spherical compartment.
  requires_simulation: ball-conversion
  status: pass
  gate_class: acceptance_criterion

canonical_runs:
- name: default
  script: workspace/studies/unstructured-geometry/sims/run.py
  args: []
  label: "Ball (R = 4 µm, unstructured P1): conversion + exchange, 8 seeds each"
  default: true

visualizations:
- name: unstructured-geometry
  address: html:viz/unstructured_geometry.html
  chart: viz/unstructured_geometry.html
  render: "python sims/run.py"

conclusion: |
  Results (results/metrics.json, 2026-10-03). Re-run after Study B2d, with Smoldyn confined
  by the mesh's boundary triangles and the creation fix:
  - **Conversion:** A follows exp(−kt) (|z| ≤ 1.5); A + B is conserved to 0.11%; B matches
    the continuum FEM to 0.53% relative L2. The sphere membrane gave 0.4% and 1.0%.
  - **Exchange:** mass balance to 0.86%; steady ratio within 0.11% of k2/k1.
  - **Geometry:** the polyhedral mesh is 1.4% smaller in volume than the ball. With the mesh
    as the membrane, the particle and PDE domains are identical, so this is now a
    geometry-representation error of the model, not a mismatch between the two halves.
  The co-simulation runs on an unstructured mesh, and the handoff stays conservative.
  Follow-ups:
  - membrane-bound particles;
  - native VCell on the same analytic sphere: done in sphere-cosim-vs-native (B2b).
    VCell handles curved geometries (analytic, image and CSG) with tangent-plane/Voronoi
    membrane numerics, so that is a discretization comparison, not a capability gap;
  - higher-order (P2) PDE, or a finer mesh, to shrink the 1.4% volume error.

runs:
  - name: default
    emitter: json
    outcomes:
      particle-decay-exact-in-ball: pass
      handoff-conserves-in-ball: pass
      field-matches-continuum-in-ball: pass
      exchange-steady-state-in-ball: pass

findings:
  - id: F-01
    tier: observation
    statement: >
      The particle reaction is geometry-independent: on the body-fitted tetrahedral ball mesh
      the mean A follows A₀·e^(−kt) with a max |z| of 1.54 over time (well under the 4.0 band),
      so the unstructured domain does not perturb the first-order decay.
    claim_scope: behavioral
    generality: {axes_tested: [geometry], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: particle-decay-exact-in-ball}
    next_action: None — decay confirmed geometry-independent on the mesh.
    next_action_type: replicate
  - id: F-02
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      The sparse interpolation/scatter matrix P keeps the particle ↔ field handoff conservative
      and accurate on the mesh: mean (A + B) is conserved to 0.11% (b2_conversion_mass_balance_max_rel_dev
      = 0.00107) and mean B matches the continuum FEM solution to 0.53% relative L2
      (b2_conversion_b_vs_continuum_rel_l2 = 0.00530), both far inside their 2% / 5% bands.
    claim_scope: mechanism
    generality: {axes_tested: [geometry], level: mechanism}
    provenance: {run_ids: [default]}
    evidence: {from_test: handoff-conserves-in-ball}
    next_action: >
      Extend to membrane-bound particles and a higher-order (P2) PDE to shrink the 1.4% mesh
      volume error (b2_mesh_volume_rel_err = −0.0139).
    next_action_type: escalate_model
  - id: F-03
    tier: observation
    statement: >
      Detailed balance holds on the mesh with field-dependent creation: the late-time A/B ratio
      is within 0.11% of k2/k1 (b2_exchange_steady_ratio_rel_err = 0.00110) and exchange mass
      balance holds to 0.86% (b2_exchange_mass_balance_max_rel_dev = 0.00864).
    claim_scope: behavioral
    generality: {axes_tested: [geometry], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: exchange-steady-state-in-ball}
    next_action: None — steady state reproduced on the unstructured mesh.
    next_action_type: replicate

conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all four behavior tests
      pass against it. The Smoldyn confinement + creation fix (post-B2d) is baked into the run.
  biological_validation:
    basis: >
      Not a biological claim — this validates that the hybrid co-simulation runs on a body-fitted
      unstructured PDE mesh of a curved domain with a conservative, accurate particle ↔ field handoff.
  explanatory_gain:
    basis: >
      F-02 localizes the only residual to a 1.4% geometry-representation error of the polyhedral
      mesh (not a mismatch between the two halves), since the mesh boundary now serves as the
      particle membrane too.

conclusion_logic:
  if_primary_tests_pass: >
    The co-simulation supports an unstructured body-fitted mesh for curved domains with a
    conservative handoff — extend to membrane-bound particles and P2/finer meshes to shrink the
    1.4% volume error; the native-VCell comparison on the analytic sphere is a discretization
    comparison (done in B2b), not a capability gap.
  if_primary_tests_fail: >
    A decay |z| ≥ 4, mass-balance deviation ≥ 2%, continuum L2 ≥ 5%, or steady-ratio error ≥ 5%
    would mean the P-matrix handoff is non-conservative or the mesh is too coarse — re-check
    build_mesh_hybrid_document (the P rows must sum to 1) and the mesh resolution before trusting the arm.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: theory-matched
  caveat: >
    The polyhedral mesh is 1.4% smaller in volume than the exact ball; with the mesh boundary as
    the particle membrane this is a geometry-representation error of the model, not a two-halves mismatch.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
    - cmd: "pixi run -e dev python workspace/studies/unstructured-geometry/sims/run.py"
      produces: [results/metrics.json, viz/unstructured_geometry.html]
      note: >
        Ball (R = 4 µm, P1 on a gmsh tet mesh, 33³ background grid): conversion + exchange,
        8 seeds each. Needs dolfinx (FEniCSx) and the patched Smoldyn from the pixi env.
  inputs_committed: [results/metrics.json]
  wall_time_s: 119.36
