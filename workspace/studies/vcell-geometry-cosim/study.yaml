conclusion: |
  Results (results/metrics.json, 2026-10-04; 32 seeds per variant):

  | variant | shell vs interior (z) | interior vs E[B] | conversion balance | exchange balance | steady ratio err |
  |---|---|---|---|---|---|
  | none | −1.36% (−12.5) | +1.07% | +0.12% | −2.7% | 1.2% |
  | adapters | +0.02% (0.2) | +2.06% | +1.30% | +0.19% | 1.8% |
  | adapters+volumes | +0.02% (0.15) | +0.20% | +0.12% | +0.96% | 0.13% |

  - **`none` reproduces native VCell with the vcell-fvsolver#25 binning correction.** The shell is
    −1.36% (native −1.41%; the forward model −1.33%) and the interior +1.07% (native +1.14%).
    Exchange drifts −2.7%: creation runs over the smooth volume, while consumption runs over the
    staircase volume.
  - **`adapters`** removes the shell bias but overcounts particle sources (+1.30% in conversion).
    In exchange this overcount happens to cancel the creation mismatch, which is not a principled
    result.
  - **`adapters+volumes` is unbiased and conservative.** The shell bias is +0.02% (z = 0.15); the
    interior is within 0.2% of E[B]; conversion is at the lag level (+0.12%) and exchange at the
    first-order coupling level (+0.96%, against 1.2% for the box-domain A3). It also has the best
    steady ratio.
  - Native vcell-fvsolver keeps full voxel volumes. The co-simulation offers both: `none` to
    compare with VCell, and `adapters+volumes` (the default) for accuracy.

runs:
- name: default
  emitter: json
  outcomes:
    corrected-shell-unbiased: pass
    corrected-interior-matches: pass
    corrected-exchange-conserves: pass
    vcell-like-shell-depletion: fail

findings:
- id: F-01
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    The adapters+volumes correction makes the coupling unbiased on VCell's own geometry: the
    outer-shell bias is +0.017% (b2e_adapters_volumes_shell_bias = 0.000167, within ±0.5%) and
    the interior is +0.20% of E[B] (b2e_adapters_volumes_interior_rel = 0.00203, within ±1%).
    Using accessible volumes both in the adapter and as the FV element volumes removes the
    smooth-vs-staircase volume mismatch.
  claim_scope: mechanism
  generality: {axes_tested: [geometry], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: corrected-shell-unbiased}
  next_action: Keep adapters+volumes as the default for VCell-geometry co-sim runs.
  next_action_type: replicate
  kind: computational
  status: contradicts
- id: F-02
  tier: observation
  statement: >
    The corrected coupling stays conservative in exchange: A + B balance at t = 5 s is +0.96%
    (b2e_adapters_volumes_exchange_balance = 0.00959, within ±1.5% and below the 1.2% box-domain
    A3 baseline), and the steady ratio error is 0.13% (b2e_adapters_volumes_exchange_steady_ratio_rel_err
    = 0.00128) — the best of the three corrections.
  claim_scope: behavioral
  generality: {axes_tested: [geometry], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: corrected-exchange-conserves}
  next_action: None — exchange is conservative at the first-order coupling level.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: observation
  statement: >
    The intentional regression check FAILS as designed: with correction="none" (full voxel
    volumes) the outer-shell bias is −1.36% (b2e_none_shell_bias = −0.0136, z = −12.5), outside
    the ±0.5% band. This reproduces native VCell with the vcell-fvsolver#25 binning correction
    (native −1.41%, forward model −1.33%) and keeps the smooth-vs-staircase volume mismatch
    (staircase 266.73 µm³ vs smooth 261.82 µm³, ~1.8%) visible in the report card.
  claim_scope: behavioral
  generality: {axes_tested: [geometry, alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: vcell-like-shell-depletion}
  next_action: >
    None — this is a kept regression pin documenting native VCell's shell depletion; it is why
    adapters+volumes is the default. Do not "fix" it.
  next_action_type: replicate

  kind: computational
  status: contradicts
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; the three
      adapters+volumes primary tests pass, and the `none` secondary reproduces native VCell's
      −1.4% shell depletion (fails by design), pinning the volume-mismatch behaviour.
  biological_validation:
    basis: >
      Not a biological claim — this validates an accessible-volume correction that makes the
      co-simulation both unbiased and conservative on VCell's own staircase-PDE / smooth-membrane geometry.
  explanatory_gain:
    basis: >
      F-01/F-03 localize the native-VCell shell depletion to the smooth-vs-staircase volume
      mismatch (~1.8%) and show that accessible volumes in BOTH the adapter and the FV element
      volumes are required to remove it; adapters-only cancels only coincidentally in exchange.
      Found and fixed a VTK vtkSelectEnclosedPoints misclassification (now a vertical-ray parity test).

conclusion_logic:
  if_primary_tests_pass: >
    The adapters+volumes correction is unbiased (shell +0.02%, interior +0.20%) and conservative
    (exchange +0.96%) on VCell's geometry — adopt it as the default; keep `none` to compare with
    native VCell, where the ~1.4% shell depletion is expected.
  if_primary_tests_fail: >
    A shell bias outside ±0.5%, interior outside ±1%, or exchange balance outside ±1.5% under
    adapters+volumes would mean the accessible-volume fold map or the masked FV volumes are wrong —
    re-check geometry/accessible.py and the inside-test (geometry/inside.py) before trusting the correction.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: theory-matched
  caveat: >
    One secondary test (vcell-like-shell-depletion) FAILS by design: it pins native VCell's −1.4%
    shell depletion so the volume mismatch stays visible. The native arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3   # scripted, committed inputs + metrics; VCell realization needs the dev env
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/vcell-geometry-cosim/sims/run.py"
    produces: [results/metrics.json, viz/vcell_geometry_cosim.html]
    note: >
      Co-sim on VCell's realization of the ball: 3 corrections × conversion + exchange, 32 seeds.
      Needs the dev pixi env (VCellFVRealization via libvcell) and the patched Smoldyn.
  - cmd: "pixi run -e dev python workspace/studies/vcell-geometry-cosim/sims/render_3d.py record && pixi run python workspace/studies/vcell-geometry-cosim/sims/render_3d.py render"
    produces: [viz/vcell_geometry_3d.png, viz/vcell_geometry_3d_movie.gif, viz/vcell_geometry_3d_interactive.html]
    note: Record 3D bundles in the dev env; render figures in the default env (PyVista / three.js).
  inputs_committed: [results/metrics.json]
  wall_time_s: 620.84
