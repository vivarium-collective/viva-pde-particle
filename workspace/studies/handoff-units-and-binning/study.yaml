schema_version: 4
name: handoff-units-and-binning
title: Each side alone, and the particle-to-grid handoff
investigation: cosim-vs-embedded-hybrid
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Accepted

# What the study measures (anchors for the test rows / report).
readouts:
- name: a1_fv_cosine_rel_err
  description: max relative error of the FV cosine mode vs analytic decay at t = 1 s
- name: a1_particle_variance_rel_err
  description: relative error of binned per-axis variance (dx²/6-corrected) vs 2Dt
- name: a1_histogram_count_mismatch
  description: max |histogram total − molecule count| over all records
- name: a1_boundary_class_max_abs_z
  description: max |z| of per-node-class counts vs element-volume share
- name: a1_corner_to_interior_conc_ratio
  description: corner-node concentration ÷ interior concentration
- name: a1_edge_to_interior_conc_ratio
  description: edge-node concentration ÷ interior concentration
- name: a1_wall_time_s
  description: wall-clock time of the full run
question: |
  Before coupling anything: does each half of the co-simulation behave correctly on its own,
  and does the particle-to-grid handoff (nearest-node binning, boundary element volumes,
  counts to µM) follow vcell-fvsolver's conventions?
hypothesis: |
  The FV process reproduces continuum diffusion to discretization accuracy. Smoldyn's binned
  particle variance grows as 2Dt per axis. Binning conserves molecules exactly. Uniformly
  distributed particles give a uniform binned concentration up to and including the
  boundary nodes, because boundary elements have 1/2 (edge) or 1/4 (corner) volume as in
  VCell's CartesianMesh.
objective: |
  Four checks, all on the shared CartesianGrid:
  (1) FV diffusion of cos(πx/L)cos(πy/L) (21×21, L = 10 µm, D = 1, dt = 0.01, t = 1 s)
      against exp(-2π²Dt/L²);
  (2) 20,000 particles diffusing from the centre cell (D = 1, 4 seeds): the variance of the
      binned positions, minus dx²/6 (the initial cell spread plus Sheppard's binning
      correction), against 2Dt;
  (3) the histogram sum equals the molecule count at every record;
  (4) 100,000 uniform particles after 2 s of diffusion (11×11, 4 seeds): the counts per
      node class (corner, edge, interior) match their element-volume shares.
description: |
  The FV operator is the one in vcell-fvsolver's FV_SOLVER (backward-Euler diffusion,
  volume-scaled zero-flux Laplacian); tests/test_grid_and_fv.py checks its discrete
  eigenmodes exactly. Here it is compared to the continuum solution. Particle runs use the
  full process-bigraph composite (SmoldynHybrid with no fields), so the histogram handoff
  is the production path.

baseline:
- name: particle-diffusion-baseline
  composite: viva_pde_particle.composites.examples.particle_diffusion
  params:
    n_particles: 20000
    diffusion: 1.0
    start: center
    dt: 0.01

variants: []

# v4 Build-tab view (conditions.baseline + the four handoff checks as variants).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.particle_diffusion
    params: {n_particles: 20000, diffusion: 1.0, start: center, dt: 0.01}
  variants:
  - name: fv-cosine-mode
    diff_from_baseline: "FV diffusion of cos(πx/L)cos(πy/L) on 21×21 (L=10 µm, D=1, dt=0.01, t=1 s) vs exp(-2π²Dt/L²)."
  - name: particle-variance
    diff_from_baseline: "20,000 particles from the centre cell (D=1, 4 seeds); binned variance − dx²/6 vs 2Dt."
  - name: boundary-volumes
    diff_from_baseline: "100,000 uniform particles after 2 s on 11×11 (4 seeds); per-class counts vs element-volume shares."

simulation_set:
- name: default
  kind: baseline
  status: ran
  base_model: viva_pde_particle.composites.examples.particle_diffusion
  seeds: [0]
  metrics: [a1_fv_cosine_rel_err, a1_particle_variance_rel_err, a1_histogram_count_mismatch, a1_boundary_class_max_abs_z]
  pass_fail_tests: [fv-matches-continuum-diffusion, particle-variance-matches-2Dt, histogram-conserves-molecules, boundary-volumes-give-uniform-concentration]
  description: "Four handoff checks on the shared CartesianGrid; results/metrics.json."

behavior_tests:
- name: fv-matches-continuum-diffusion
  classification: primary
  description: Max relative error of the FV cosine mode vs the analytic decay at t = 1 s.
  measure:
    kind: derived_scalar
    field: a1_fv_cosine_rel_err
  pass_if:
    op: "<"
    value: 0.01
    provenance:
      kind: theory
      note: Second order in space and first order in time; expected error ~1e-3 on this grid.
  requires_simulation: particle-diffusion-baseline
  status: pass
  gate_class: acceptance_criterion
- name: particle-variance-matches-2Dt
  classification: primary
  description: Relative error of the binned per-axis variance (corrected by dx²/6) vs 2Dt at t = 1 s.
  measure:
    kind: derived_scalar
    field: a1_particle_variance_rel_err
  pass_if:
    op: "<"
    value: 0.03
    provenance:
      kind: theory
      note: Free Brownian motion; 80,000 molecule samples give ~0.5% sampling error on the variance.
  requires_simulation: particle-diffusion-baseline
  status: pass
  gate_class: acceptance_criterion
- name: histogram-conserves-molecules
  classification: primary
  description: Max |histogram total - molecule count| over all records.
  measure:
    kind: derived_scalar
    field: a1_histogram_count_mismatch
  pass_if:
    op: "=="
    value: 0
    provenance:
      kind: theory
      note: Every molecule maps to exactly one node (clamped nearest-node index).
  requires_simulation: particle-diffusion-baseline
  status: pass
  gate_class: acceptance_criterion
- name: boundary-volumes-give-uniform-concentration
  classification: primary
  description: Max |z| over node classes of per-class counts vs element-volume share.
  measure:
    kind: derived_scalar
    field: a1_boundary_class_max_abs_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Binomial sampling; |z| < 4 for a correct volume convention (corner 1/4, edge 1/2).
  requires_simulation: particle-diffusion-baseline
  status: pass
  gate_class: acceptance_criterion

pipeline_gate:
  prerequisites: []
  enables:
  - field-modulated-decay
  proceed_condition: All four handoff checks pass.

canonical_runs:
- name: default
  script: workspace/studies/handoff-units-and-binning/sims/run.py
  args: []
  label: "FV vs analytic, particle variance vs 2Dt, histogram conservation, boundary volumes"
  default: true

visualizations:
- name: handoff
  address: html:viz/handoff.html
  chart: viz/handoff.html
  render: "python sims/run.py"

conclusion: |
  All four checks pass (results/metrics.json, 2026-10-03; re-run after the record-time fix):
  - FV vs analytic: 6.0e-4 relative error;
  - binned particle variance vs 2Dt: 0.13% (0.96% before the fix, which was the one-step record lag);
  - histogram mismatch: 0 molecules;
  - node classes vs volume shares: max |z| = 0.48. Corner and edge concentrations are
    within 0.4% of interior.
  Both halves and the handoff behave as specified.

runs:
- name: default
  emitter: json
  outcomes:
    fv-matches-continuum-diffusion:
      result: PASS
    particle-variance-matches-2Dt:
      result: PASS
    histogram-conserves-molecules:
      result: PASS
    boundary-volumes-give-uniform-concentration:

      result: PASS
findings:
- id: F-01
  tier: observation
  statement: >
    Each half of the co-simulation is correct in isolation: the FV operator reproduces
    the analytic cosine-mode decay to 6.0e-4 relative error, and Smoldyn's binned
    per-axis variance (dx²/6-corrected) matches 2Dt to 0.13% relative error at t=1 s.
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: fv-matches-continuum-diffusion}
  next_action: None — both solvers verified against their continuum limits.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    The particle-to-grid handoff is exact and volume-correct: the histogram total never
    differs from the molecule count (mismatch = 0 molecules at every record), and
    uniformly distributed particles bin to a uniform concentration across node classes
    (max |z| = 0.48; corner and edge concentrations 1.0034× and 1.0019× interior, both
    within 0.4%), confirming the 1/4-corner and 1/2-edge element-volume convention.
  claim_scope: mechanism
  generality: {axes_tested: [discretization], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: boundary-volumes-give-uniform-concentration}
  next_action: Proceed to the coupled field-modulated-decay study (pipeline gate satisfied).
  next_action_type: escalate_model

  kind: computational
  status: confirms
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all four primary
      behavior tests pass against it (FV err 6.0e-4, variance err 0.13%, histogram
      mismatch 0, boundary max|z| 0.48).
  biological_validation:
    basis: >
      Numerical-convergence study: each half matches its continuum/theoretical limit — FV
      vs analytic diffusion and binned particle variance vs 2Dt (free Brownian motion).
  explanatory_gain:
    basis: >
      Localizes correctness to the handoff itself: molecule conservation is exact and the
      boundary element-volume convention (corner 1/4, edge 1/2) yields a uniform binned
      concentration, so the production composite's particle→grid path is sound.

conclusion_logic:
  if_primary_tests_pass: >
    All four handoff checks pass, so both halves and the particle-to-grid handoff behave
    as specified: continuum diffusion, 2Dt particle spread, exact molecule conservation,
    and the VCell element-volume convention at boundaries. The pipeline gate to
    field-modulated-decay is satisfied — coupling can proceed on a verified foundation.
  if_primary_tests_fail: >
    An FV error ≥ 1%, a variance error ≥ 3%, any nonzero histogram mismatch, or a boundary
    max|z| ≥ 4 would mean the FV operator, the particle variance, molecule conservation, or
    the boundary element-volume convention is wrong — fix the offending half before
    coupling, since every downstream study inherits this handoff.

report:
  confidence: high
  evidence_quality: calibrated
  caveat: ""

reproducibility:
  level: L3   # scripted, committed inputs + metrics
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/handoff-units-and-binning/sims/run.py"
    produces: [results/metrics.json, viz/handoff.html]
    note: >
      Runs the four handoff checks (FV cosine mode, particle variance, histogram
      conservation, boundary volumes) through the production SmoldynHybrid composite.
  inputs_committed: [results/metrics.json]
  wall_time_s: 3.841249942779541
