schema_version: 4
name: handoff-units-and-binning
title: Each side alone, and the particle-to-grid handoff
investigation: cosim-vs-embedded-hybrid
created: '2026-10-03'
status: ran
phase: Evaluate

question: |
  Before coupling anything: does each half of the co-simulation behave correctly on its own,
  and does the particle-to-grid handoff (nearest-node binning, boundary element volumes,
  counts to µM) follow vcell-fvsolver's conventions?
hypothesis: |
  The FV process reproduces continuum diffusion to discretization accuracy. Smoldyn's binned
  particle variance grows as 2Dt per axis. Binning conserves molecules exactly. Uniformly
  distributed particles give a uniform binned concentration up to and including the
  boundary nodes, because boundary elements have 1/2 (edge) or 1/4 (corner) volume as in
  VCell's CartesianMesh.
objective: |
  Four checks, all on the shared CartesianGrid:
  (1) FV diffusion of cos(πx/L)cos(πy/L) (21×21, L = 10 µm, D = 1, dt = 0.01, t = 1 s)
      against exp(-2π²Dt/L²);
  (2) 20,000 particles diffusing from the centre cell (D = 1, 4 seeds): the variance of the
      binned positions, minus dx²/6 (the initial cell spread plus Sheppard's binning
      correction), against 2Dt;
  (3) the histogram sum equals the molecule count at every record;
  (4) 100,000 uniform particles after 2 s of diffusion (11×11, 4 seeds): the counts per
      node class (corner, edge, interior) match their element-volume shares.
description: |
  The FV operator is the one in vcell-fvsolver's FV_SOLVER (backward-Euler diffusion,
  volume-scaled zero-flux Laplacian); tests/test_grid_and_fv.py checks its discrete
  eigenmodes exactly. Here it is compared to the continuum solution. Particle runs use the
  full process-bigraph composite (SmoldynHybrid with no fields), so the histogram handoff
  is the production path.

baseline:
- name: particle-diffusion-baseline
  composite: viva_pde_particle.composites.examples.particle_diffusion
  params:
    n_particles: 20000
    diffusion: 1.0
    start: center
    dt: 0.01

variants: []

behavior_tests:
- name: fv-matches-continuum-diffusion
  classification: primary
  description: Max relative error of the FV cosine mode vs the analytic decay at t = 1 s.
  measure:
    kind: derived_scalar
    field: a1_fv_cosine_rel_err
  pass_if:
    op: "<"
    value: 0.01
    provenance:
      kind: theory
      note: Second order in space and first order in time; expected error ~1e-3 on this grid.
  requires_simulation: particle-diffusion-baseline
- name: particle-variance-matches-2Dt
  classification: primary
  description: Relative error of the binned per-axis variance (corrected by dx²/6) vs 2Dt at t = 1 s.
  measure:
    kind: derived_scalar
    field: a1_particle_variance_rel_err
  pass_if:
    op: "<"
    value: 0.03
    provenance:
      kind: theory
      note: Free Brownian motion; 80,000 molecule samples give ~0.5% sampling error on the variance.
  requires_simulation: particle-diffusion-baseline
- name: histogram-conserves-molecules
  classification: primary
  description: Max |histogram total - molecule count| over all records.
  measure:
    kind: derived_scalar
    field: a1_histogram_count_mismatch
  pass_if:
    op: "=="
    value: 0
    provenance:
      kind: theory
      note: Every molecule maps to exactly one node (clamped nearest-node index).
  requires_simulation: particle-diffusion-baseline
- name: boundary-volumes-give-uniform-concentration
  classification: primary
  description: Max |z| over node classes of per-class counts vs element-volume share.
  measure:
    kind: derived_scalar
    field: a1_boundary_class_max_abs_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Binomial sampling; |z| < 4 for a correct volume convention (corner 1/4, edge 1/2).
  requires_simulation: particle-diffusion-baseline

pipeline_gate:
  prerequisites: []
  enables:
  - field-modulated-decay
  proceed_condition: All four handoff checks pass.

canonical_runs:
- name: default
  script: workspace/studies/handoff-units-and-binning/sims/run.py
  args: []
  label: "FV vs analytic, particle variance vs 2Dt, histogram conservation, boundary volumes"
  default: true

visualizations:
- name: handoff
  chart: viz/handoff.html
  render: "python sims/run.py"

conclusion: |
  All four checks pass (results/metrics.json, 2026-10-03; re-run after the record-time fix):
  - FV vs analytic: 6.0e-4 relative error;
  - binned particle variance vs 2Dt: 0.13% (0.96% before the fix, which was the one-step record lag);
  - histogram mismatch: 0 molecules;
  - node classes vs volume shares: max |z| = 0.48. Corner and edge concentrations are
    within 0.4% of interior.
  Both halves and the handoff behave as specified.
