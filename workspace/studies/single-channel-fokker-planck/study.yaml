      result: PASS
findings:
- id: F-01
  tier: observation
  statement: >
    Finite diffusion (Tests 4–5): the co-simulation matches the direct Fokker–Planck
    solutions to within sampling noise in every cell — reduced χ² = 0.54 (Test 4, x₀),
    0.80 (Test 4, x₁) and 0.80 / 0.89 / 0.86 (Test 5, x₀/x₁/x₂), all inside [0, 2].
    Relative L2 differences (1.0–1.6%) are smaller than the paper's (1.9% / 3.3% for Test 4).
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: test4-cosim-matches-fokker-planck}
  next_action: None — finite-diffusion regime reproduced within sampling noise.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: anomaly
  statement: >
    DIVERGENCE (failed primary): in the fast-diffusion regime (Test 3) the co-simulation's
    reduced χ² against Eq 4 is 2.48, just over the [0, 2] band, so test3-cosim-matches-fokker-planck
    FAILS. The native VCell arm sits just under at 1.82 (passes). Both solvers share the same
    small 0.58% relative-L2 bias (about twice the 0.30% sampling noise), so the gap belongs to
    the spatial hybrid at Δτ = 0.002, not to the co-simulation.
  claim_scope: behavioral
  generality: {axes_tested: [discretization, alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: test3-cosim-matches-fokker-planck}
  next_action: >
    Reduce Δτ for the Test 3 fast-diffusion arm (the Δτ check shows the bias is first-order
    and vanishes as Δτ → 0), or widen the χ² band to reflect the resolved 0.1% histogram shift.
  next_action_type: refine_representation
  kind: computational
  status: partial
- id: F-03
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    The Test 3 gap is a first-order time-discretization error, not a model error: the mean-bias
    fit offset + slope·Δτ gives a slope of −0.51 ± 0.06 and an offset of −0.044% ± 0.027%,
    consistent with zero (passes [−0.001, 0.001]). Native VCell at Δτ = 0.002 matches the fit's
    prediction, confirming the bias scales with Δτ and vanishes as Δτ → 0.
  claim_scope: mechanism
  generality: {axes_tested: [discretization], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: test3-bias-is-first-order-in-dtau}
  next_action: Carry the Δτ-convergence result into the Test 3 arm's acceptance reasoning.
  next_action_type: escalate_model

  kind: computational
  status: contradicts
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; four of five behavior
      tests pass against it, with the Test 3 co-sim χ² = 2.48 failing the [0, 2] band honestly.
  biological_validation:
    basis: >
      Reproduces Schaff et al. 2016 Figs 4–6: finite-diffusion Tests 4–5 match the Fokker–Planck
      solutions within sampling noise (reduced χ² 0.54–0.89, rel. L2 below the paper's). Test 3
      (fast diffusion) matches to 0.58% rel. L2 but its co-sim χ² (2.48) is marginally over threshold.
  explanatory_gain:
    basis: >
      F-02/F-03 localize the Test 3 marginal failure to a first-order Δτ discretization bias shared
      by both solvers (slope −0.51 ± 0.06, offset consistent with zero), not to the co-simulation —
      the bias vanishes as Δτ → 0.

conclusion_logic:
  if_primary_tests_pass: >
    All regimes reproduce the direct Fokker–Planck solutions within sampling noise — the hybrid
    co-simulation samples the piecewise-deterministic process the paper's equations describe.
  if_primary_tests_fail: >
    Test 3's co-sim reduced χ² (2.48) is just over the [0, 2] band. The divergence is a first-order
    Δτ time-discretization bias (slope −0.51 ± 0.06, offset ≈ 0) shared with the native solver, so
    it is a resolvable discretization effect, not a co-simulation or model error — rerun the Test 3
    arm at smaller Δτ to bring χ² under threshold.

# Executive panel (top of the study page). Most fields derive from the spine; these are
# the authored overrides that make the card read well at a glance.
report:
  confidence: medium
  evidence_quality: literature-matched
  caveat: >
    Test 3's co-sim reduced χ² (2.48) marginally exceeds the [0, 2] band (native 1.82 passes);
    the gap is a first-order Δτ bias shared by both solvers that vanishes as Δτ → 0. Tests 4–5 run
    co-sim only (VCell's node-centred mesh differs from Eq T2.1), and Test 5 runs at Δτ = 10⁻⁴.
    The native arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3   # scripted, committed inputs + metrics; native arm needs the dev env
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/single-channel-fokker-planck/sims/run.py"
    produces: [results/metrics.json, viz/fokker_planck.html, viz/dtau.html]
    note: >
      Tests 3–5: references, co-sim ensembles (10,000 / 12,500 / 12,500) and native Test 3.
      The native arm needs the dev pixi env; in the default env only the co-sim arms run.
  inputs_committed: [results/metrics.json]
