schema_version: 4
name: separable-calcium-sparks
title: "Schaff et al. 2016, Test 1 / Fig 1B: separable calcium sparks on both solvers"
investigation: vcell-hybrid-paper-benchmarks
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_reviewed
confidence: Accepted

# What the study measures (anchors for the test rows / report).
readouts:
  - c1_cosim_eps_slope — log-log slope of ε vs N, co-simulation (theory −1/2)
  - c1_native_eps_slope — log-log slope of ε vs N, native VCell hybrid (theory −1/2)
  - c1_cosim_eps_n128 — ε at N=128, Δt=0.005 s, co-simulation
  - c1_native_eps_n128 — ε at N=128, Δt=0.005 s, native VCell hybrid
  - c1_cosim_vs_native_eps_ratio — solver difference ÷ combined statistical error
  - c1_{cosim,native}_eps_dt{0.02,0.01,0.005} — ε across Δt (flat ⇒ statistically dominated)

question: |
  Do the native VCell hybrid solver and the process-bigraph co-simulation both reproduce
  Fig 1B of Schaff et al. (2016)? The error of the trial-mean calcium against its exact
  expectation should fall as N^-1/2 with the number of trials, and be statistically
  dominated at small Δt.
hypothesis: |
  The channels' gating is independent of calcium, so E[U] solves the linear PDE driven by
  the exact open probability p(t) = k_on/(k_on+k_off)·(1 − e^-(k_on+k_off)t). Both solvers'
  trial means converge to it with ε ∝ N^-1/2. At N = 128 the statistical error dominates
  the Δt error for Δt ≤ 0.02 s. The two solvers differ only by sampling.
objective: |
  Model (Eq. 1 of the paper): ∂U/∂t = D∇²U + J·Σᵢ ξᵢ δ(r − rᵢ) − V_p(U − U₀), no-flux
  boundaries. D = 1 µm²/s, J = 10 µM·µm³/s, U₀ = 0.1 µM, V_p = 1 s⁻¹, k_on = 1 s⁻¹,
  k_off = 5 s⁻¹, 24 channels starting closed, T = 5 s.
  Geometry: [0, 10.1]×[0, 2.1]×[0, 0.5] µm³, Δx = Δy = 0.1.
  Runs: 128 trials per solver at Δt ∈ {0.02, 0.01, 0.005} s. ε(N) is taken from nested
  subsets at Δt = 0.005, and ε is the RMS over space and time of (trial mean − E[U]),
  relative to max(E[U] − U₀).
description: |
  Channels are immobile particle species C (closed) and O (open), one per channel node.
  Calcium U is a PDE field, and influx is a PDE source k·[O] with k = J·602.214.
  - The native reference goes through VCell's own math generation (pyvcell → libvcell
    → vcell-fvsolver/Smoldyn 2.38), with two documented .smoldynInput post-processing
    steps (viva_pde_particle.reference.vcell_native):
    1. channels are placed at their nodes, because a BioModel cannot express per-node
       particle counts;
    2. VCell's no-op jump process O → O (from the influx) is dropped. In Smoldyn it would
       suppress channel closing (competing first-order reactions), which raises the open
       fraction from 1/6 to about 0.9.
  - The reference E[U] is computed on the same grid with a fine step (dt_ref = 1e-4).

  Deviations from the paper, both PROVISIONAL:
  - Δz = 0.25 (3 z-nodes). Current VCell requires at least 3 nodes per axis; the paper
    used Δz = 0.5.
  - Channel coordinates: the paper shows 4 columns of 6 (Fig 1A) without coordinates.
    Here, x = 2, 4, 6, 8 µm and y = 0.3 ... 1.8 µm on the z = 0 layer (approved by the
    author for now).

baseline:
- name: calcium-sparks-test1
  composite: viva_pde_particle.composites.examples.calcium_sparks
  params:
    test: 1
    dt: 0.005

variants: []

# v4 Build-tab view (conditions.baseline + the Δt sweep as variants).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.calcium_sparks
    params: {test: 1, dt: 0.005}
  variants:
    - name: dt-sweep
      diff_from_baseline: "Δt ∈ {0.02, 0.01, 0.005} s at N=128 (ε(Δt) series)."
    - name: native-vcell-arm
      diff_from_baseline: "Same model solved by the native VCell hybrid (dev env) for the solver-agreement check."

simulation_set:
  - name: default
    kind: baseline
    status: ran
    base_model: viva_pde_particle.composites.examples.calcium_sparks
    seeds: [0]
    metrics: [c1_cosim_eps_slope, c1_native_eps_slope, c1_cosim_eps_n128, c1_cosim_vs_native_eps_ratio]
    pass_fail_tests: [cosim-error-falls-as-inverse-sqrt-n, native-error-falls-as-inverse-sqrt-n, cosim-error-small-at-128-trials, solvers-differ-only-by-sampling]
    description: "Fig 1B: 128 trials × 3 Δt × 2 solvers; results/metrics.json."

behavior_tests:
- name: cosim-error-falls-as-inverse-sqrt-n
  classification: primary
  description: Log-log slope of ε vs N for the co-simulation (Δt = 0.005 s).
  measure:
    kind: derived_scalar
    field: c1_cosim_eps_slope
  pass_if:
    op: range
    low: -0.75
    high: -0.25
    provenance:
      kind: literature
      note: Schaff et al. 2016, Fig 1B; Monte Carlo error ∝ N^-1/2 when statistical error dominates.
  requires_simulation: calcium-sparks-test1
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: native-error-falls-as-inverse-sqrt-n
  classification: primary
  description: Log-log slope of ε vs N for the native VCell hybrid (Δt = 0.005 s).
  measure:
    kind: derived_scalar
    field: c1_native_eps_slope
  pass_if:
    op: range
    low: -0.75
    high: -0.25
    provenance:
      kind: literature
      note: Schaff et al. 2016, Fig 1B.
  requires_simulation: calcium-sparks-test1
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: cosim-error-small-at-128-trials
  classification: secondary
  description: ε of the co-simulation at N = 128, Δt = 0.005 s.
  measure:
    kind: derived_scalar
    field: c1_cosim_eps_n128
  pass_if:
    op: "<"
    value: 0.03
    provenance:
      kind: theory
      note: About 4% at N = 16 scales to about 1.4% at N = 128 under N^-1/2.
  requires_simulation: calcium-sparks-test1
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: solvers-differ-only-by-sampling
  classification: primary
  description: >-
    ε between the co-simulation and native trial means, divided by the combined
    statistical error sqrt(ε_cosim² + ε_native²), at N = 128 and Δt = 0.005 s.
  measure:
    kind: derived_scalar
    field: c1_cosim_vs_native_eps_ratio
  pass_if:
    op: "<"
    value: 1.5
    provenance:
      kind: theory
      note: Independent ensembles of the same expectation; the ratio is about 1 when only sampling differs.
  requires_simulation: calcium-sparks-test1
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]

canonical_runs:
- name: default
  script: workspace/studies/separable-calcium-sparks/sims/run.py
  args: []
  label: "Fig 1B: ε(N), ε(Δt), co-sim vs native (128 trials × 3 Δt × 2 solvers)"
  default: true
- name: render-3d
  script: workspace/studies/separable-calcium-sparks/sims/render_3d.py
  args: []
  label: "3D figures: one seed per path recorded into results bundles (record: dev env; render: default env)"

visualizations:
- name: calcium-sparks-fig1b
  address: html:viz/calcium_sparks_fig1b.html
  chart: viz/calcium_sparks_fig1b.html
  render: "python sims/run.py"
- name: sparks-3d
  address: image:viz/sparks_3d.png
  chart: viz/sparks_3d.png
  render: "python sims/render_3d.py render"
  requires: "sims/render_3d.py record (dev env) writes the bundles in runs/"
- name: sparks-3d-movie
  address: image:viz/sparks_3d_movie.gif
  chart: viz/sparks_3d_movie.gif
  render: "python sims/render_3d.py render"
- name: sparks-3d-interactive
  address: threejs:viz/sparks_3d_interactive.html
  render: "python sims/render_3d.py render"

conclusion: |
  Reproduced on both solvers (results/metrics.json, 2026-10-03; run in the dev pixi env):
  - ε vs N slopes: −0.46 for both solvers, against −1/2;
  - ε at N = 128: 1.37% (co-sim) and 1.32% (native);
  - ε is flat across Δt = 0.02–0.005 s (1.3–1.6%), i.e. statistically dominated, as in the paper;
  - co-sim vs native difference: 0.75× the combined statistical error.

  Two VCell findings for the native path, both handled in vcell_native.to_biomodel and
  in post-processing:
  - **No-op jump process** (virtualcell/vcell#2158): a particle catalysing a continuous
    source produces a no-op Smoldyn reaction that suppresses channel closing.
  - **Zero-reactant mass action:** VCell keeps only −Kr·Π(products) and discards Kf, so
    the constant leak V_p·U₀ vanished. It is now written as General kinetics. An earlier
    run without this fix gave a native ε(128) of 1.6%.

runs:
  - name: default
    emitter: json
    outcomes:
      cosim-error-falls-as-inverse-sqrt-n: pass
      native-error-falls-as-inverse-sqrt-n: pass
      cosim-error-small-at-128-trials: pass
      solvers-differ-only-by-sampling: pass

findings:
  - id: F-01
    tier: observation
    statement: >
      Both solvers reproduce Fig 1B's Monte-Carlo convergence: the log-log slope of ε vs
      N is −0.47 (co-simulation) and −0.46 (native VCell hybrid), both within sampling of
      the theoretical −1/2.
    claim_scope: behavioral
    generality: {axes_tested: [alt_implementation], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: cosim-error-falls-as-inverse-sqrt-n}
    next_action: None — convergence rate confirmed on both solvers.
    next_action_type: replicate
  - id: F-02
    tier: observation
    statement: >
      At N=128, Δt=0.005 s the error is small and essentially solver-independent: ε=1.37%
      (co-sim) vs 1.32% (native), and ε is flat across Δt=0.02–0.005 s (1.3–1.6%) — i.e.
      statistically dominated, exactly as the paper reports.
    claim_scope: behavioral
    generality: {axes_tested: [discretization], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: cosim-error-small-at-128-trials}
    next_action: None.
    next_action_type: replicate
  - id: F-03
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      The co-simulation and native solvers agree to within sampling: their trial-mean
      difference is 0.75× the combined statistical error (<1.5), so decomposing the hybrid
      solver into process-bigraph processes does not change the answer. Reaching this
      required two documented VCell fixes in the native path (no-op jump process
      virtualcell/vcell#2158; zero-reactant mass-action leak).
    claim_scope: mechanism
    generality: {axes_tested: [alt_implementation], level: mechanism}
    provenance: {run_ids: [default]}
    evidence: {from_test: solvers-differ-only-by-sampling}
    next_action: >
      Carry the two VCell fixes upstream; revisit the provisional Δz=0.25 and channel
      coordinates once VCell supports Δz=0.5 and per-node particle counts.
    next_action_type: escalate_model

conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all four
      behavior tests pass against it.
  biological_validation:
    basis: >
      Reproduces Schaff et al. 2016 Fig 1B on both solvers: N^-1/2 convergence, ε≈1.3%
      at N=128, statistically-dominated Δt dependence.
  explanatory_gain:
    basis: >
      F-03 shows the process-bigraph decomposition is answer-preserving (0.75× combined
      error) and localizes the two VCell encoding fixes needed to make the native
      reference match.

conclusion_logic:
  if_primary_tests_pass: >
    Both solvers reproduce Fig 1B (N^-1/2 convergence, ε≈1.3% at N=128, Δt-dominated by
    sampling) and agree to within sampling — the process-bigraph decomposition is
    answer-preserving. Carry the two VCell encoding fixes upstream and lift the provisional
    Δz / channel-coordinate deviations when VCell supports them.
  if_primary_tests_fail: >
    A slope outside [−0.75, −0.25], ε(128) ≥ 3%, or a cosim-vs-native ratio ≥ 1.5 would
    mean the decomposition or the native encoding changed the answer — re-examine the
    VCell math generation (no-op jump, zero-reactant mass action) before trusting the arm.

# Executive panel (top of the study page). Most fields derive from the spine; these are
# the authored overrides that make the card read well at a glance.
report:
  confidence: high
  evidence_quality: literature-matched
  caveat: >
    Two deviations from the paper remain provisional (Δz=0.25 vs 0.5; channel coordinates
    chosen, author-approved). The native arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3   # scripted, committed inputs + metrics; native arm needs the dev env
  rerun:
    - cmd: "pixi run -e dev python workspace/studies/separable-calcium-sparks/sims/run.py"
      produces: [results/metrics.json, viz/calcium_sparks_fig1b.html]
      note: >
        Full Fig-1B run (128 trials × 3 Δt × 2 solvers). The native arm needs the dev
        pixi env (pyvcell spatial-hybrid). In the default env only the co-sim arm runs.
    - cmd: "pixi run -e dev python workspace/studies/separable-calcium-sparks/sims/render_3d.py record && pixi run python workspace/studies/separable-calcium-sparks/sims/render_3d.py render"
      produces: [viz/sparks_3d.png, viz/sparks_3d_movie.gif, viz/sparks_3d_interactive.html]
      note: Record 3D bundles in the dev env; render figures in the default env (PyVista).
  inputs_committed: [results/metrics.json]
  wall_time_s: 196.5
