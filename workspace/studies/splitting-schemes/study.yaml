schema_version: 4
name: splitting-schemes
title: "Operator-splitting schemes for PDE/particle coupling: Jacobi (fvsolver), Gauss–Seidel, Strang"
investigation: hybrid-generalizability
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: designed
implementation_status: implemented
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_reviewed
confidence: Accepted

# What the study measures (anchors for the test rows / report).
readouts:
  - b3_jacobi_order — fitted convergence order in the coupling interval τ, Jacobi (fvsolver) scheme
  - b3_gs_particles_first_order — fitted order of Gauss–Seidel, particles stepped first
  - b3_gs_pde_first_order — fitted order of Gauss–Seidel, PDE stepped first
  - b3_strang_order — fitted order of symmetric Strang splitting (sits near the sampling floor)
  - b3_strang_over_jacobi_err_k32 — Strang error ÷ Jacobi error at the largest interval (k=32, τ=0.16 s)
  - b3_{jacobi,gs_particles_first,gs_pde_first,strang}_err_k{2,4,8,16,32} — max-over-time |mean survival − continuum| per coupling interval
  - b3_wall_time_s — wall-clock time of the full sweep

parent_studies:
- coupling-interval-convergence

question: |
  The embedded vcell-fvsolver hard-codes one lagged (Jacobi-type) splitting. With the
  coupling expressed as process-bigraph processes, can other splittings be used, and how
  much accuracy do they buy at a given coupling interval?
hypothesis: |
  Jacobi and both Gauss–Seidel orderings are first order in the coupling interval τ.
  Symmetric Strang splitting (half the PDE substeps, the particle step, the other half) is
  second order in the mean dynamics and much more accurate at large τ.
objective: |
  A5's A_p + B_f → C_f (k = 2/(µM·s), 20,000 A, 11×11×3 slab); Δt = 0.005;
  τ = k·Δt with k ∈ {2, 4, 8, 16, 32}; 64 seeds per point.
  Error: max over time of |mean survival − continuum|. Orders fitted for k ≥ 4.
description: |
  HybridCoupler composes the same FVReactionDiffusion and SmoldynHybrid engines and only
  orders their substeps. Its jacobi scheme reproduces the two-process composite with
  coupling="fvsolver" exactly (same seeds give identical counts; regression test in
  tests/test_hybrid_cosim.py).

baseline:
- name: splitting-bimolecular
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params:
    k: 2.0
    dt: 0.005
  note: Built with viva_pde_particle.composites.hybrid.build_coupler_document(scheme=...) in sims/run.py.

variants: []

# v4 Build-tab view (conditions.baseline + the scheme × coupling-interval sweep as variants).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.bimolecular_hybrid
    params: {k: 2.0, dt: 0.005}
  variants:
    - name: splitting-scheme-sweep
      diff_from_baseline: "Same engines, re-ordered substeps: Jacobi (fvsolver), Gauss–Seidel (particles-first and pde-first), symmetric Strang."
    - name: coupling-interval-sweep
      diff_from_baseline: "τ = k·Δt with k ∈ {2, 4, 8, 16, 32} at Δt = 0.005 s; 64 seeds per point; orders fitted for k ≥ 4."

simulation_set:
  - name: default
    kind: baseline
    status: ran
    base_model: viva_pde_particle.composites.examples.bimolecular_hybrid
    seeds: [0]
    metrics: [b3_jacobi_order, b3_gs_particles_first_order, b3_strang_over_jacobi_err_k32, b3_strang_err_k32]
    pass_fail_tests: [jacobi-first-order, gauss-seidel-first-order, strang-much-more-accurate]
    description: "4 splitting schemes × 5 coupling intervals × 64 seeds; results/metrics.json."

behavior_tests:
- name: jacobi-first-order
  classification: primary
  description: Fitted order of the Jacobi (fvsolver) scheme.
  measure:
    kind: derived_scalar
    field: b3_jacobi_order
  pass_if:
    op: range
    low: 0.7
    high: 1.5
    provenance:
      kind: theory
      note: Explicit lagged splitting is first order.
  requires_simulation: splitting-bimolecular
  status: pass
  gate_class: acceptance_criterion
- name: gauss-seidel-first-order
  classification: secondary
  description: Fitted order of Gauss–Seidel (particles first).
  measure:
    kind: derived_scalar
    field: b3_gs_particles_first_order
  pass_if:
    op: range
    low: 0.7
    high: 1.5
    provenance:
      kind: theory
      note: Sequential (Lie) splitting is first order.
  requires_simulation: splitting-bimolecular
  status: pass
  gate_class: acceptance_criterion
- name: strang-much-more-accurate
  classification: primary
  description: Strang error / Jacobi error at the largest coupling interval (k = 32, τ = 0.16 s).
  measure:
    kind: derived_scalar
    field: b3_strang_over_jacobi_err_k32
  pass_if:
    op: "<"
    value: 0.25
    provenance:
      kind: theory
      note: Symmetric splitting cancels the leading splitting error.
  requires_simulation: splitting-bimolecular
  status: pass
  gate_class: acceptance_criterion

canonical_runs:
- name: default
  script: workspace/studies/splitting-schemes/sims/run.py
  args: []
  label: "4 splitting schemes × 5 coupling intervals × 64 seeds"
  default: true

visualizations:
- name: splitting-schemes
  address: html:viz/splitting_schemes.html
  chart: viz/splitting_schemes.html
  render: "python sims/run.py"

conclusion: |
  Results (results/metrics.json, 2026-10-03):
  - **First-order schemes:** Jacobi (fvsolver) has order 1.23, Gauss–Seidel orders are
    1.01 and 1.08. At τ = 0.16 s their errors are about 0.021–0.023.
  - **Strang:** the error stays within about 2× of the sampling floor (4–11·10⁻⁴) for every
    τ up to 0.16 s, 25× smaller than Jacobi at τ = 0.16 s. It is too close to the floor to
    fit an order; more seeds or larger τ would resolve it.
  - **Consequence:** for this model, Strang splitting lets the particle side step about 32×
    less often than the PDE side at roughly the accuracy fvsolver's scheme reaches with
    k ≈ 1–2. That's a large potential speed-up for particle-dominated runs (A6).
    vcell-fvsolver's hybrid loop (SimTool.cpp) fixes one splitting order, so adopting
    Strang there would mean modifying the solver; here it is a coupler option.

runs:
  - name: default
    emitter: json
    outcomes:
      jacobi-first-order: pass
      gauss-seidel-first-order: pass
      strang-much-more-accurate: pass

findings:
  - id: F-01
    tier: observation
    statement: >
      All three lagged splittings are first order in the coupling interval τ: the fitted
      order is 1.23 for Jacobi (fvsolver), 1.01 for Gauss–Seidel (particles-first) and 1.08
      for Gauss–Seidel (pde-first). At τ = 0.16 s their errors cluster at 2.1–2.3% (Jacobi
      0.0218, GS-particles 0.0208, GS-pde 0.0226).
    claim_scope: behavioral
    generality: {axes_tested: [discretization], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: jacobi-first-order}
    next_action: None — first-order behaviour confirmed for all lagged schemes.
    next_action_type: replicate
  - id: F-02
    tier: mechanism
    mechanism_origin: engineered
    statement: >
      Symmetric Strang splitting is dramatically more accurate at large coupling interval:
      at k = 32 (τ = 0.16 s) the Strang error is 0.000859, 3.94% of the Jacobi error
      (b3_strang_over_jacobi_err_k32 = 0.0394, i.e. a 25× reduction), well under the 0.25
      acceptance band. Expressing the coupling as process-bigraph substeps makes this
      re-ordering a coupler option rather than a solver modification.
    claim_scope: mechanism
    generality: {axes_tested: [alt_implementation], level: mechanism}
    provenance: {run_ids: [default]}
    evidence: {from_test: strang-much-more-accurate}
    next_action: >
      Exploit in particle-dominated runs (A6): Strang lets the particle side step ~32× less
      often than the PDE side at the accuracy Jacobi reaches near k ≈ 1–2.
    next_action_type: escalate_model
  - id: F-03
    tier: observation
    statement: >
      Strang's error stays within ~2× of the sampling floor across the whole sweep
      (0.000405 at k=2 to 0.000859 at k=32), so its fitted order (0.34) is floor-dominated
      and not resolvable — more seeds or larger τ would be needed to measure the expected
      second order.
    claim_scope: behavioral
    generality: {axes_tested: [discretization], level: instance_specific}
    provenance: {run_ids: [default]}
    evidence: {from_test: strang-much-more-accurate}
    next_action: Add more seeds or extend τ to resolve the Strang convergence order.
    next_action_type: replicate

conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; the Jacobi scheme
      reproduces the fvsolver two-process composite exactly (regression test in
      tests/test_hybrid_cosim.py). All three behavior tests pass against the committed metrics.
  biological_validation:
    basis: >
      Not a biological claim — this is a numerical-methods study of operator-splitting
      accuracy for the PDE/particle coupling against the continuum survival curve.
  explanatory_gain:
    basis: >
      F-02 shows the process-bigraph decomposition unlocks a splitting (Strang) the embedded
      fvsolver cannot express, buying a 25× accuracy gain at the largest coupling interval.

conclusion_logic:
  if_primary_tests_pass: >
    Lagged splittings (Jacobi, Gauss–Seidel) are first order and Strang is far more accurate
    at large τ (25× smaller error at k=32) — adopt Strang as a coupler option for
    particle-dominated runs; resolve the Strang order with more seeds / larger τ.
  if_primary_tests_fail: >
    A fitted Jacobi order outside [0.7, 1.5], or a Strang/Jacobi ratio ≥ 0.25 at k=32, would
    mean the splitting substeps are mis-ordered or the sampling floor was mis-estimated —
    re-check build_coupler_document and the seed count before trusting the accuracy claim.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: theory-matched
  caveat: >
    Strang's fitted order (0.34) is sampling-floor-dominated and does not resolve its
    expected second order; the accuracy claim rests on the error ratio, not the fitted order.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
    - cmd: "pixi run -e dev python workspace/studies/splitting-schemes/sims/run.py"
      produces: [results/metrics.json, viz/splitting_schemes.html]
      note: >
        Full sweep (4 splitting schemes × 5 coupling intervals × 64 seeds). Deterministic
        per seed; the Jacobi scheme matches the fvsolver two-process composite exactly.
  inputs_committed: [results/metrics.json]
  wall_time_s: 25.66
