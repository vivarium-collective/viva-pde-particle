conclusion: |
  Results (results/metrics.json, 2026-10-03; 32 seeds per solver; co-sim re-run with the B2d default membrane):

  **Geometry.**
  - The node-centred smoothed cell domain is within −0.50% of the ball volume. Taken as-is,
    the pyvcell export is −8.4% (the tiling convention above).
  - Smoothing cuts the RMS radial error of the boundary surface from 0.108 to 0.065 µm.

  **Interior.** Both solvers match the exact uniform E[B]: native +0.49%, co-sim −0.37%.

  **Next to the membrane.**
  - **Native:**
    - The outer shell (r > 3.5 µm) is 2.3% below the interior (z = −20).
    - The profile declines smoothly from about r = 2.5 µm to 0.98 at the membrane: the
      diffusive footprint of the B sources dropped at the boundary.
    - This is B2b's exterior-binning loss, now localized.
  - **Co-sim:**
    - The shell is +0.12% (z = 1.2), unbiased.
    - The first run, with Smoldyn confined by the exact sphere, gave +1.3% (z = 10).
      This study attributed that to Pᵀ folding of exterior-node counts. Study B2d showed the
      cause was the domain mismatch instead: particles in the ~1.4% sliver between sphere and
      inscribed mesh load the boundary DOFs.
    - Confining Smoldyn by the mesh's own boundary (now the default) removes it.
  - **Smoothing** barely changes the native shell bias (−2.27% vs −2.29% on the staircase).
    The field is smooth on the scale of the boundary displacement (< 0.1 µm), so the smoothed
    grid helps geometry and visualization; the field artifact is in the coupling.

  Neither effect is a limitation of VCell's geometry or PDE numerics. Both come from how
  particles near a curved membrane are binned to the field.
  - Native: VCellSmoldynOutput::computeHistogram (vcell-fvsolver,
    bridgeVCellSmoldyn/VCellSmoldynOutput.cpp:476–548) bins each molecule to the nearest
    node. Its correction for a nearest node in a different compartment (re-bin to the
    nearest same-compartment neighbour) is present but commented out. Re-enabling it is the
    likely native fix (virtualcell/vcell-fvsolver#25).
  - Co-sim fix (B2d, done): the mesh boundary as the particle membrane.

runs:
- name: default
  emitter: json
  outcomes:
    smoothed-grid-represents-ball:
      result: PASS
    smoothing-improves-surface:
      result: PASS
    native-interior-matches-expectation:
      result: PASS
    cosim-interior-matches-expectation:
      result: PASS
    native-shell-unbiased:
      result: FAIL
    cosim-shell-unbiased:

      result: PASS
findings:
- id: F-01
  tier: observation
  statement: >
    The node-centred smoothed cell domain reproduces the ball to within −0.50%
    (b2c_node_centred_smoothed_volume_rel_err = −0.0050), against −8.4% for the pyvcell export
    taken as-is, and smoothing cuts the RMS radial error of the boundary surface from 0.108 µm
    (staircase) to 0.065 µm.
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: smoothed-grid-represents-ball}
  next_action: None — the analysis-side node-centred tiling correction recovers the geometry.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: observation
  statement: >
    Away from the membrane both solvers match the exact uniform E[B]: the native interior is
    +0.49% (b2c_native_interior_rel = 0.0049) and the co-sim interior +0.25%
    (b2c_cosim_interior_rel = 0.0025), both well inside ±2%.
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: native-interior-matches-expectation}
  next_action: None — interior transfer is unbiased on both solvers.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: mechanism
  mechanism_origin: discovered
  statement: >
    The native outer shell (r > 3.5 µm) sits 2.3% below the interior
    (b2c_native_shell_bias = −0.0227, z = −20.1), failing the ±1% unbiasedness band, while the
    co-sim shell is unbiased at +0.12% (b2c_cosim_shell_bias = 0.0012, z = 1.17). This localizes
    B2b's exterior-binning loss to the field next to the curved membrane: molecules binned to
    nodes outside the voxelized cell drop their PDE source. The native fix is to re-enable the
    commented-out same-compartment binning correction in VCellSmoldynOutput::computeHistogram
    (virtualcell/vcell-fvsolver#25).
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: native-shell-unbiased}
  next_action: >
    Re-enable the same-compartment binning correction in vcell-fvsolver and re-run the shell bias.
  next_action_type: escalate_model

  kind: computational
  status: contradicts
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; the four geometry and
      interior tests pass, and the native-shell failure is a pinned, intentional marker of the
      boundary artifact.
  biological_validation:
    basis: >
      Both solvers reproduce the exact uniform E[B] in the interior (native +0.49%, co-sim +0.25%);
      the only departure is the native near-membrane depletion.
  explanatory_gain:
    basis: >
      F-03 localizes B2b's native mass loss to exterior-node binning at the curved membrane
      (−2.3% outer-shell depletion), distinguishing it from the co-sim, whose shell is unbiased
      once the mesh boundary is the particle membrane (B2d).
conclusion_logic:
  if_primary_tests_pass: >
    Both solvers transfer particles to the field without interior bias and the smoothed grid
    represents the ball — the near-membrane depletion seen natively is a coupling artifact, not a
    PDE or geometry error. Pursue the vcell-fvsolver same-compartment binning fix.
  if_primary_tests_fail: >
    An interior bias beyond ±2% or a smoothed-grid volume error beyond ±1% would mean the
    particle-to-field transfer or the geometry correction is wrong — re-examine smoothed_domain
    and the lumped-mass weighting before trusting the shell diagnosis.

report:
  confidence: high
  evidence_quality: theory-matched
  caveat: >
    The native-shell test fails by design (−2.3%) to keep the boundary artifact visible; it marks
    an open vcell-fvsolver issue, not a study defect. Native fields need the dev pixi env.

reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/near-membrane-fields/sims/run.py"
    produces: [results/metrics.json, viz/near_membrane_fields.html, results/native_mean_B_smoothed.vtu]
    note: >
      Ball conversion, 32 seeds per solver; the native arm reads fields on pyvcell's smoothed
      grid and needs the dev pixi env (pyvcell spatial-hybrid).
  inputs_committed: [results/metrics.json]
  wall_time_s: 73.4
