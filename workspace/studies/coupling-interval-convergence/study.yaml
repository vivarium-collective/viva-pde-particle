schema_version: 4
name: coupling-interval-convergence
title: Coupling error vs Smoldyn step multiplier, co-simulation (two schemes) and native VCell
investigation: cosim-vs-embedded-hybrid
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Accepted
parent_studies:
- bimolecular-hybrid

# What the study measures (anchors for the test rows / report).
readouts:
- name: a5_cosim_fvsolver_order
  description: fitted order (k ≥ 4) of the co-sim error, coupling="fvsolver"
- name: a5_native_order
  description: fitted order (k ≥ 4) of the native VCell hybrid error
- name: a5_fvsolver_mode_vs_native_err_ratio_k16
  description: co-sim (fvsolver) error ÷ native error at k = 16
- name: a5_cosim_fvsolver_err_k{1..32}
  description: co-sim fvsolver-mode error across the step-multiplier sweep
- name: a5_cosim_start_of_interval_err_k{1..32} / a5_cosim_start_of_interval_order
  description: the alternate scheme
- name: a5_native_err_k{1..16}
  description: native VCell hybrid error across the sweep (crashes at k = 32)
question: |
  How does the error of the lagged explicit coupling grow with the coupling interval
  k·Δt (Smoldyn steps once per k PDE steps)? Does the co-simulation reproduce
  fvsolver's coupling error, and does process-bigraph's plain scheduling
  ("start-of-interval") do better or worse?
hypothesis: |
  Explicit lagged coupling is first order in k·Δt. The co-sim "fvsolver" mode applies the
  same lag as the embedded solver, so it has the same error. "start-of-interval" reads
  the field at the start of the Smoldyn step instead of at T+(k−1)Δt, so its error
  differs; its sign and size are to be measured.
objective: |
  A4 model with k = 2/(µM·s), 20,000 A, Δt = 0.005, t = 1.6 s, 64 seeds per
  configuration, step multiplier k ∈ {1, 2, 4, 8, 16, 32}.
  The error is the max over time of |mean surviving fraction − continuum limit|
  (A continuous, Δt/10). The order is fitted for k ≥ 4, above the sampling floor
  (~5·10⁻⁴).

baseline:
- name: bimolecular-k2
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params:
    k: 2.0
    dt: 0.005
    step_multiplier: 1

variants:
- name: step-multiplier-sweep
  composite: viva_pde_particle.composites.examples.bimolecular_hybrid
  params:
    k: 2.0
    dt: 0.005
    step_multiplier: 16

# v4 Build-tab view (conditions.baseline + the step-multiplier sweep as variants).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.bimolecular_hybrid
    params: {k: 2.0, dt: 0.005, step_multiplier: 1}
  variants:
  - name: step-multiplier-sweep
    diff_from_baseline: "step_multiplier k ∈ {1,2,4,8,16,32}, 64 seeds each; error vs k·Δt for fvsolver, start-of-interval and native."
  - name: native-vcell-arm
    diff_from_baseline: "Same sweep solved by the native VCell hybrid (SimTool.cpp main loop); crashes at k=32."

simulation_set:
- name: default
  kind: baseline
  status: ran
  base_model: viva_pde_particle.composites.examples.bimolecular_hybrid
  seeds: [0]
  metrics: [a5_cosim_fvsolver_order, a5_native_order, a5_fvsolver_mode_vs_native_err_ratio_k16, a5_cosim_start_of_interval_order]
  pass_fail_tests: [cosim-fvsolver-mode-first-order, native-first-order, cosim-reproduces-native-coupling-error]
  description: "Error vs k·Δt: co-sim (fvsolver, start-of-interval) and native; 64 seeds each; results/metrics.json."

behavior_tests:
- name: cosim-fvsolver-mode-first-order
  classification: primary
  description: Fitted order (k ≥ 4) of the co-sim error with coupling="fvsolver".
  measure:
    kind: derived_scalar
    field: a5_cosim_fvsolver_order
  pass_if:
    op: range
    low: 0.7
    high: 1.5
    provenance:
      kind: theory
      note: Explicit lagged operator splitting is first order in the coupling interval.
  requires_simulation: step-multiplier-sweep
  status: pass
  gate_class: regression_pin
- name: native-first-order
  classification: primary
  description: Fitted order (k ≥ 4) of the native VCell hybrid error.
  measure:
    kind: derived_scalar
    field: a5_native_order
  pass_if:
    op: range
    low: 0.7
    high: 1.5
    provenance:
      kind: theory
      note: Same scheme (SimTool.cpp main loop).
  requires_simulation: step-multiplier-sweep
  status: pass
  gate_class: regression_pin
- name: cosim-reproduces-native-coupling-error
  classification: primary
  description: Co-sim (fvsolver mode) error / native error at k = 16.
  measure:
    kind: derived_scalar
    field: a5_fvsolver_mode_vs_native_err_ratio_k16
  pass_if:
    op: range
    low: 0.8
    high: 1.25
    provenance:
      kind: theory
      note: Same lag semantics (verified in tests/test_scheduling_semantics.py), so the same coupling error.
  requires_simulation: step-multiplier-sweep
  status: pass
  gate_class: regression_pin

canonical_runs:
- name: default
  script: workspace/studies/coupling-interval-convergence/sims/run.py
  args: []
  label: "Error vs k·Δt: co-sim (fvsolver, start-of-interval) and native; 64 seeds each"
  default: true

visualizations:
- name: coupling-convergence
  address: html:viz/coupling_convergence.html
  chart: viz/coupling_convergence.html
  render: "python sims/run.py"

conclusion: |
  Results (results/metrics.json, 2026-10-03):
  - **Both fvsolver-semantics solvers are first order** in the coupling interval:
    fitted order 1.23 (co-sim fvsolver mode) and 1.07 (native).
  - **Their errors match:** at k = 16 (0.08 s) the co-sim error is 0.0110 and native
    0.0104 (ratio 1.05). The co-simulation reproduces the embedded solver's coupling
    error, not only its results.
  - **"start-of-interval" coupling** (plain process-bigraph scheduling) roughly halves the
    error at large k: 0.0049 at k = 16 and 0.0110 at k = 32, against 0.0110 and 0.0218 for
    fvsolver mode. Reading the field at the start of the particle step appears to partly
    cancel the PDE side's lag. vcell-fvsolver's hybrid loop fixes one ordering, so that
    choice is not available there without changing the solver;
    higher-order splitting is Investigation B.
  - **Native crash:** VCell's native solver crashed at k = 32 (Smoldyn step 0.16 s, equal to
    the output interval), so native results stop at k = 16.

runs:
- name: default
  emitter: json
  outcomes:
    cosim-fvsolver-mode-first-order:
      result: PASS
    native-first-order:
      result: PASS
    cosim-reproduces-native-coupling-error:

      result: PASS
findings:
- id: F-01
  tier: observation
  statement: >
    The lagged explicit coupling is first order in the coupling interval k·Δt on both
    fvsolver-semantics solvers: fitted order (k ≥ 4) is 1.23 (co-sim fvsolver mode) and
    1.07 (native), both inside the theoretical [0.7, 1.5] band.
  claim_scope: behavioral
  generality: {axes_tested: [discretization], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-fvsolver-mode-first-order}
  next_action: None — convergence order confirmed on both solvers.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: observation
  statement: >
    The co-simulation reproduces the embedded solver's coupling error, not just its
    results: at k = 16 (0.08 s) the co-sim fvsolver-mode error is 0.0110 and the native
    error 0.0104, a ratio of 1.05 (band [0.8, 1.25]).
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-reproduces-native-coupling-error}
  next_action: None.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    Plain process-bigraph "start-of-interval" scheduling roughly halves the coupling
    error at large k (0.0049 at k=16, 0.0110 at k=32 vs 0.0110 and 0.0218 for fvsolver
    mode; fitted order 0.80), because reading the field at the start of the particle step
    partly cancels the PDE side's lag. vcell-fvsolver's fixed ordering cannot use this
    without changing the solver.
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-fvsolver-mode-first-order}
  next_action: >
    Pursue higher-order operator splitting in Investigation B; the native solver crashes
    at k=32 (Smoldyn step equal to the output interval), so its sweep stops at k=16.
  next_action_type: escalate_model

  kind: computational
  status: confirms
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all three primary
      behavior tests pass (co-sim order 1.23, native order 1.07, k=16 ratio 1.05).
  biological_validation:
    basis: >
      Both fvsolver-semantics solvers show the expected first-order error in the coupling
      interval k·Δt, matching explicit-lagged operator-splitting theory.
  explanatory_gain:
    basis: >
      F-02 shows the co-simulation reproduces the embedded solver's coupling error to
      within 5%, and F-03 quantifies how an alternate scheduling scheme (start-of-interval)
      halves that error — a design lever unavailable to the fixed native loop.

conclusion_logic:
  if_primary_tests_pass: >
    The co-simulation reproduces vcell-fvsolver's first-order coupling error (order 1.23 vs
    1.07; k=16 ratio 1.05), so it matches not only the embedded solver's results but its
    error scaling. The start-of-interval scheme offers a lower-error alternative that the
    fixed native loop cannot adopt; higher-order splitting is Investigation B.
  if_primary_tests_fail: >
    A fitted order outside [0.7, 1.5] or a k=16 ratio outside [0.8, 1.25] would mean the
    co-sim lag semantics diverge from the embedded solver — re-examine the fvsolver-mode
    scheduling (tests/test_scheduling_semantics.py) before trusting the reproduction claim.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: calibrated
  caveat: >
    Order/ratio bands are theory-based; native results stop at k=16 (VCell crashes at k=32),
    and the native arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/coupling-interval-convergence/sims/run.py"
    produces: [results/metrics.json, viz/coupling_convergence.html]
    note: >
      Step-multiplier sweep k ∈ {1,2,4,8,16,32}, 64 seeds per configuration. The native
      arm needs the dev pixi env (pyvcell spatial-hybrid) and stops at k=16.
  inputs_committed: [results/metrics.json]
  wall_time_s: 91.3147361278534
