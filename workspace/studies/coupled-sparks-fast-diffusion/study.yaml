schema_version: 4
name: coupled-sparks-fast-diffusion
title: "Schaff et al. 2016, Test 2 / Fig 2: coupled calcium sparks in the fast-diffusion limit, both solvers"
investigation: vcell-hybrid-paper-benchmarks
created: '2026-10-03'
status: ran
phase: Evaluate
# Six-axis canonical status (derived-consistent; legacy `status` kept for back-compat)
design_status: drafted
implementation_status: complete
simulation_status: ran
evaluation_status: evaluated
gate_status: passed
expert_review_status: not_requested
confidence: Accepted
parent_studies:
- separable-calcium-sparks

# What the study measures (anchors for the test rows / report).
readouts:
- name: c2_cosim_max_mean_z
  description: max over t∈{1,2,3}s and {U,n} of |z| of co-sim mean vs exact well-mixed
- name: c2_native_max_mean_z
  description: same |z|, native VCell hybrid
- name: c2_cosim_max_l2_n
  description: max over t of L2 distance between P(n,t) histograms, co-sim vs reference
- name: c2_native_max_l2_n
  description: same L2, native VCell hybrid
- name: c2_cosim_vs_native_min_ks_pvalue
  description: min KS p-value over t and {U,n}, co-sim vs native
- name: c2_{cosim,native}_min_ks_pvalue
  description: min KS p vs the well-mixed reference (open observation)
- name: c2_{cosim,native}_max_l2_u
  description: max over t of L2 distance between p(U,t) histograms vs reference
question: |
  With channel opening coupled to local calcium (k_on·U(rᵢ)/U₀) and fast diffusion
  (D = 1000 µm²/s), do both hybrid solvers reproduce the distributions of calcium and
  open-channel number given by the exact well-mixed process, as in Fig 2 of the paper?
hypothesis: |
  At D = 1000 the cell is effectively well mixed. The spatial hybrid's volume-averaged
  U and open count n then follow the well-mixed piecewise-deterministic process, which
  the paper sampled with the Gibson–Bruck method; here it is sampled exactly by
  event-driven simulation (viva_pde_particle.benchmarks.pdmp).
objective: |
  Parameters as in Test 1, except k_on = 0.1 s⁻¹ (opening at k_on·U/U₀), D = 1000 µm²/s
  and Δt = 0.2 ms; 500 trials per solver.
  The reference is 20,000 exact realizations of the well-mixed process with
  V = 10.1×2.1×0.5 µm³.
  At t = 1, 2, 3 s the comparison uses:
  - mean |z| of U and n against the reference;
  - the L2 distance between histograms, as in the paper;
  - two-sample KS tests, against the reference and between the solvers.
description: |
  The native solver is driven as in C1 (VCell math generation, channels placed at their
  nodes, VCell's no-op O → O process dropped). One fix found here also applies to C1:
  VCell mass action with no reactants drops Kf, so the constant leak V_p·U₀ vanished
  from the native PDE. Before that fix the native solver was biased (mean |z| = 11.5);
  it is now written as General kinetics.
  Deviations (provisional) as in C1: Δz = 0.25; channel coordinates are author-approved
  defaults.

baseline:
- name: calcium-sparks-test2
  composite: viva_pde_particle.composites.examples.calcium_sparks
  params:
    test: 2
    dt: 0.0002

variants: []

# v4 Build-tab view (conditions.baseline + the solver/ensemble arms actually run).
conditions:
  baseline:
    composite: viva_pde_particle.composites.examples.calcium_sparks
    params: {test: 2, dt: 0.0002}
  variants:
  - name: cosim-arm
    diff_from_baseline: "Spatial hybrid as process-bigraph co-simulation; 500 trials at D=1000 µm²/s, Δt=0.2 ms."
  - name: native-vcell-arm
    diff_from_baseline: "Same model solved by the native VCell hybrid (dev env) for the solver-agreement check."
  - name: well-mixed-reference
    diff_from_baseline: "20,000 exact realizations of the well-mixed piecewise-deterministic process (viva_pde_particle.benchmarks.pdmp)."

simulation_set:
- name: default
  kind: baseline
  status: ran
  base_model: viva_pde_particle.composites.examples.calcium_sparks
  seeds: [0]
  metrics: [c2_cosim_max_mean_z, c2_native_max_mean_z, c2_cosim_max_l2_n, c2_cosim_vs_native_min_ks_pvalue]
  pass_fail_tests: [cosim-matches-well-mixed-means, native-matches-well-mixed-means, cosim-channel-distribution-l2, native-channel-distribution-l2, solvers-agree]
  description: "Fig 2: 500 trials × 2 solvers at D=1000 µm²/s vs 20,000 exact well-mixed realizations; results/metrics.json."

behavior_tests:
- name: cosim-matches-well-mixed-means
  classification: primary
  description: Max over t ∈ {1, 2, 3} s and over {U, n} of |z| of the co-simulation mean vs the exact well-mixed process.
  measure:
    kind: derived_scalar
    field: c2_cosim_max_mean_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: Fast-diffusion limit; 500 trials against 20,000 exact realizations.
  requires_simulation: calcium-sparks-test2
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: native-matches-well-mixed-means
  classification: primary
  description: Max |z| of the native VCell hybrid mean vs the exact well-mixed process.
  measure:
    kind: derived_scalar
    field: c2_native_max_mean_z
  pass_if:
    op: "<"
    value: 4.0
    provenance:
      kind: theory
      note: As above.
  requires_simulation: calcium-sparks-test2
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: cosim-channel-distribution-l2
  classification: primary
  description: Max over t of the L2 distance between the P(n, t) histograms of the co-simulation and the reference.
  measure:
    kind: derived_scalar
    field: c2_cosim_max_l2_n
  pass_if:
    op: "<"
    value: 0.1
    provenance:
      kind: literature
      note: The paper's metric (Fig 2, 10,000 realizations gave about 0.002–0.003). With 500 trials the sampling floor is about 0.05.
  requires_simulation: calcium-sparks-test2
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: native-channel-distribution-l2
  classification: primary
  description: Max over t of the L2 distance between the P(n, t) histograms of native VCell and the reference.
  measure:
    kind: derived_scalar
    field: c2_native_max_l2_n
  pass_if:
    op: "<"
    value: 0.1
    provenance:
      kind: literature
      note: As above.
  requires_simulation: calcium-sparks-test2
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]
- name: solvers-agree
  classification: primary
  description: Min KS p-value over t and {U, n}, co-simulation vs native.
  measure:
    kind: derived_scalar
    field: c2_cosim_vs_native_min_ks_pvalue
  pass_if:
    op: ">"
    value: 0.001
    provenance:
      kind: theory
      note: The two solvers should agree; 6 comparisons with ties in n make KS conservative.
  requires_simulation: calcium-sparks-test2
  status: pass
  gate_class: acceptance_criterion
  cites: [schaff2016hybrid]

canonical_runs:
- name: default
  script: workspace/studies/coupled-sparks-fast-diffusion/sims/run.py
  args: []
  label: "Fig 2: p(U,t), P(n,t) at t = 1, 2, 3 s; 500 trials per solver vs 20,000 exact realizations"
  default: true
- name: render-3d
  script: workspace/studies/coupled-sparks-fast-diffusion/sims/render_3d.py
  args: []
  label: "3D figures: one trial per solver recorded into results bundles (record: dev env; render: default env)"

visualizations:
- name: calcium-sparks-fig2
  address: html:viz/calcium_sparks_fig2.html
  chart: viz/calcium_sparks_fig2.html
  render: "python sims/run.py"
- name: coupled-sparks-3d
  address: image:viz/coupled_sparks_3d.png
  chart: viz/coupled_sparks_3d.png
  render: "python sims/render_3d.py render"
  requires: "sims/render_3d.py record (dev env) writes the bundles in runs/"
- name: coupled-sparks-3d-movie
  address: image:viz/coupled_sparks_3d_movie.gif
  chart: viz/coupled_sparks_3d_movie.gif
  render: "python sims/render_3d.py render"
- name: coupled-sparks-3d-interactive
  address: threejs:viz/coupled_sparks_3d_interactive.html
  render: "python sims/render_3d.py render"

conclusion: |
  Results (results/metrics.json, 2026-10-03; 500 trials per solver):
  - both solvers match the exact well-mixed process in mean: max |z| = 1.57 (co-sim)
    and 0.64 (native);
  - P(n, t) L2 distance: 0.052 (co-sim) and 0.048 (native), at the 500-trial sampling floor;
  - the solvers agree with each other (min KS p = 0.035).

  Open observation: both solvers show the same marginal minimum KS p against the
  well-mixed reference (about 7·10⁻⁴), so the effect is shared and not a solver
  artifact. A plausible cause is residual spatial structure: at D = 1000 the local U at
  an open channel slightly exceeds the volume mean, raising its opening rate.
  Larger ensembles, or a D → ∞ check, would settle it (follow-up).

runs:
- name: default
  emitter: json
  outcomes:
    cosim-matches-well-mixed-means: pass
    native-matches-well-mixed-means: pass
    cosim-channel-distribution-l2: pass
    native-channel-distribution-l2: pass
    solvers-agree: pass

findings:
- id: F-01
  tier: observation
  statement: >
    In the fast-diffusion limit (D = 1000 µm²/s) both hybrid solvers match the exact
    well-mixed process in mean: max |z| over t∈{1,2,3}s and {U,n} is 1.57 (co-sim) and
    0.64 (native VCell), both well under the |z| < 4 threshold.
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-matches-well-mixed-means}
  next_action: None — mean agreement confirmed on both solvers.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-02
  tier: observation
  statement: >
    The open-channel-number distribution P(n, t) reproduces the paper's Fig 2 metric to
    the 500-trial sampling floor: max-over-t L2 distance is 0.052 (co-sim) and 0.048
    (native), both below the 0.1 band (the paper's 10,000-realization value was ~0.002–0.003).
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: cosim-channel-distribution-l2}
  next_action: None.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-03
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    The co-simulation and native VCell solvers agree with each other: their minimum KS
    p-value over t and {U,n} is 0.035 (> 0.001), so decomposing the coupled fast-diffusion
    hybrid into process-bigraph processes is answer-preserving.
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: solvers-agree}
  next_action: >
    Settle the shared marginal residual against the well-mixed reference (min KS p ≈ 7·10⁻⁴
    for both solvers) with a larger ensemble or a D → ∞ check.
  next_action_type: replicate
  kind: computational
  status: confirms
- id: F-04
  tier: observation
  statement: >
    Open observation (not a gated test): both solvers show the same small marginal minimum
    KS p against the well-mixed reference — 7.70·10⁻⁴ (co-sim) and 6.87·10⁻⁴ (native). The
    effect is shared across solvers, so it is not a co-simulation artifact; a plausible cause
    is residual spatial structure (local U at an open channel slightly exceeds the volume mean).
  claim_scope: behavioral
  generality: {axes_tested: [alt_implementation], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: solvers-agree}
  next_action: Larger ensembles or a D → ∞ check to confirm the residual is spatial structure.
  next_action_type: replicate

  kind: computational
  status: partial
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; all five behavior
      tests pass against it.
  biological_validation:
    basis: >
      Reproduces Schaff et al. 2016 Fig 2 on both solvers in the fast-diffusion limit: mean
      agreement (max |z| 1.57 / 0.64) and P(n,t) L2 at the 500-trial sampling floor (0.052 / 0.048).
  explanatory_gain:
    basis: >
      F-03 shows the process-bigraph decomposition is answer-preserving (co-sim vs native min
      KS p = 0.035); F-04 localizes a small shared residual against the well-mixed reference to
      the spatial hybrid rather than the co-simulation.

conclusion_logic:
  if_primary_tests_pass: >
    Both solvers reproduce Fig 2 in the fast-diffusion limit (well-mixed means, P(n,t) L2 at
    the sampling floor) and agree with each other — the process-bigraph decomposition of the
    coupled hybrid is answer-preserving. Follow up on the shared marginal residual against the
    well-mixed reference with a larger ensemble or D → ∞ check.
  if_primary_tests_fail: >
    A max |z| ≥ 4, an L2 ≥ 0.1, or a cosim-vs-native KS p ≤ 0.001 would mean the decomposition
    or the native encoding changed the answer — re-examine the VCell math generation and the
    well-mixed reference before trusting the arm.

# Executive panel (top of the study page). Most fields derive from the spine; these are
# the authored overrides that make the card read well at a glance.
report:
  confidence: high
  evidence_quality: literature-matched
  caveat: >
    Deviations from the paper remain provisional (Δz=0.25 vs 0.5; channel coordinates
    author-approved). An open observation — both solvers' marginal min KS p ≈ 7·10⁻⁴ against
    the well-mixed reference — is unresolved (follow-up). The native arm needs the dev pixi env.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3   # scripted, committed inputs + metrics; native arm needs the dev env
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/coupled-sparks-fast-diffusion/sims/run.py"
    produces: [results/metrics.json, viz/calcium_sparks_fig2.html]
    note: >
      Full Fig-2 run (500 trials × 2 solvers at D=1000 µm²/s vs 20,000 exact well-mixed
      realizations). The native arm needs the dev pixi env; in the default env only the
      co-sim arm runs.
  - cmd: "pixi run -e dev python workspace/studies/coupled-sparks-fast-diffusion/sims/render_3d.py record && pixi run python workspace/studies/coupled-sparks-fast-diffusion/sims/render_3d.py render"
    produces: [viz/coupled_sparks_3d.png, viz/coupled_sparks_3d_movie.gif, viz/coupled_sparks_3d_interactive.html]
    note: Record 3D bundles in the dev env; render figures in the default env (PyVista).
  inputs_committed: [results/metrics.json]
  wall_time_s: 1926.3
