conclusion: |
  Results (results/metrics.json, 2026-10-03; 32 seeds per variant; Smoldyn with the creation fix):

  | transfer / membrane | shell bias (z) | interior vs E[B] | exchange balance | wall s per sim s |
  |---|---|---|---|---|
  | grid / sphere | +1.27% (10.3) | −0.37% | +2.9% | 0.71 |
  | positions / sphere | +1.24% (10.0) | −0.36% | +2.9% | 2.98 |
  | grid / mesh | +0.12% (1.2) | +0.25% | +0.69% | 1.07 |
  | positions / mesh | +0.07% (0.7) | +0.27% | +1.0% | 3.56 |

  **The hypothesis was wrong: the membrane matters, not the transfer.**
  - With the sphere membrane, the exact P1 load leaves the shell bias unchanged.
  - The cause is the domain mismatch. Particles in the ~1.4% sliver between the sphere and the
    inscribed mesh are projected onto the boundary DOFs.
  - Confining Smoldyn by the mesh's own boundary triangles removes the bias, with either
    transfer. VCell does the same with its geometry's surface triangulation; see below.
  - With the mesh membrane, exchange mass balance is at the box-domain level (A3: 1.2%), so
    the curved geometry adds nothing.
  - With the sphere membrane, the PDE removes B over the smaller mesh while creation covers
    the full sphere, so the balance is +2.9%.

  **Credit: VCell already does this.** Its Smoldyn input confines particles by `panel tri` surfaces taken from its own
  geometry (B2b ball: 9,516 triangles enclosing 261.8 µm³), so the co-sim's mesh membrane follows VCell's practice.
  - **Co-sim:** the triangles are the PDE mesh boundary itself, so the domains are identical.
  - **Native:** the triangulation is a smoothed surface, while the PDE domain is the voxel staircase (266.7 µm³). The
    particle compartment is therefore 1.8% smaller than the PDE's cell. Times the centre-only creation factor (0.976),
    that predicts a native creation rate of 0.958, matching the measured 0.960. Particles near the smooth membrane can
    also be nearest to exterior voxel nodes (exterior binning).

  **Creation fix (Smoldyn fork).** Before it, the sphere variants showed −1.2 to −1.4%
  exchange balance. That was two errors cancelling: a creation deficit of about −2.4% and
  the sphere's extra +1.4% of volume. The mesh membrane exposed the deficit (−3.2%); the fix
  removes it.

  **Cost.**
  - The wall times in the table are for the conversion case.
  - Positions transfer costs about 4× (locating 20k particles every step), and buys nothing
    here once the membrane matches.
  - Follow-up: exchange with the mesh membrane was much slower, about 23× the sphere.
    - Smoldyn sized its virtual boxes from the initial molecule count (zero A), giving one
      box, so every molecule tested all 806 triangles every step (N×M).
    - The Smoldyn config now always sets boxsize, which gives 10×.
    - It also writes VCell's highResVolumeSamples compartment map (fork e86d552 enables its
      parsing under OPTION_VCELL), a further 1.8×, with identical results.
    - Mesh-membrane exchange now runs at 0.25 s per simulated s, against 0.21 for the sphere;
      see DESIGN.md §11.

  **Default changed:** build_mesh_hybrid_document now uses membrane="mesh" with grid
  transfer. B2, B2b and B2c are re-run with it.

runs:
- name: default
  emitter: json
  outcomes:
    mesh-membrane-removes-shell-bias:
      result: PASS
    mesh-membrane-exchange-balance:
      result: PASS
    sphere-membrane-shell-bias:

      result: FAIL
findings:
- id: F-01
  tier: observation
  statement: >
    The mesh-boundary membrane removes the outer-shell bias: with grid transfer and the
    mesh membrane the shell bias is +0.12% (z = 1.2), inside the ±0.5% band, down from
    +1.27% (z = 10.3) with the exact-sphere membrane.
  claim_scope: behavioral
  generality: {axes_tested: [geometry], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: mesh-membrane-removes-shell-bias}
  next_action: None — the default (grid transfer, mesh membrane) is unbiased in the shell.
  next_action_type: replicate
  kind: computational
  status: contradicts
- id: F-02
  tier: mechanism
  mechanism_origin: engineered
  statement: >
    The hypothesis was wrong: the membrane, not the transfer, drives the bias. Switching
    grid→positions transfer under the sphere membrane leaves the shell bias at +1.24%
    (z = 10.0), essentially unchanged from +1.27%; only confining Smoldyn by the mesh
    boundary triangles removes it. The cause is the ~1.4% domain mismatch between the exact
    sphere and the inscribed P1 mesh.
  claim_scope: mechanism
  generality: {axes_tested: [alt_implementation, geometry], level: mechanism}
  provenance: {run_ids: [default]}
  evidence: {from_test: sphere-membrane-shell-bias}
  next_action: Keep the mesh membrane as the default; carry the Smoldyn centre-test creation fix upstream.
  next_action_type: escalate_model
  kind: computational
  status: contradicts
- id: F-03
  tier: observation
  statement: >
    With the mesh membrane the exchange mass balance is +0.69% (signed), inside the ±1.5%
    band and at the box-domain level (A3: 1.2%), so the curved geometry adds nothing once
    the domains match. The sphere membrane leaves it at +2.9%.
  claim_scope: behavioral
  generality: {axes_tested: [geometry], level: instance_specific}
  provenance: {run_ids: [default]}
  evidence: {from_test: mesh-membrane-exchange-balance}
  next_action: None.
  next_action_type: replicate

  kind: computational
  status: confirms
conclusion_verdicts:
  regression_compatibility:
    basis: >
      results/metrics.json is committed and regenerated by sims/run.py; both primary tests
      pass against it. The sphere-membrane secondary test fails by design (+1.27% shell bias),
      documenting the domain-mismatch artifact.
  biological_validation:
    basis: >
      Not a biological claim: this is a numerical-coupling study. E[B] is spatially uniform,
      so the shell-bias and mass-balance bands are the physical acceptance criteria, and the
      default co-sim meets them (+0.12% bias, +0.69% balance).
  explanatory_gain:
    basis: >
      F-02 localizes the shell bias to the sphere-vs-mesh domain mismatch rather than the
      particle transfer, and identifies the Smoldyn centre-only creation defect
      (virtualcell/vcell-fvsolver#26) behind the native 0.960 creation.
conclusion_logic:
  if_primary_tests_pass: >
    The default co-sim (grid transfer, mesh membrane) is unbiased in the outer shell and
    conservative in exchange — the membrane, not the transfer, was the cause. Keep the mesh
    membrane as the default and carry the Smoldyn creation fix upstream.
  if_primary_tests_fail: >
    A shell bias outside ±0.5% or an exchange balance outside ±1.5% with the mesh membrane
    would mean the domain match is not enough — re-examine the P1 load and the boundary-triangle
    geometry before trusting the default.

# Executive panel (top of the study page).
report:
  confidence: high
  evidence_quality: theory-matched
  caveat: >
    E[B] is assumed spatially uniform for the bias bands. The sphere-membrane secondary test
    fails by design to keep the domain-mismatch artifact visible in the report card.

# Reproducibility — how to regenerate every artifact in this study.
reproducibility:
  level: L3
  rerun:
  - cmd: "pixi run -e dev python workspace/studies/cosim-boundary-transfer/sims/run.py"
    produces: [results/metrics.json, viz/cosim_boundary_transfer.html]
    note: >
      4 transfer/membrane variants × conversion + exchange, 32 seeds each. Needs the dev
      pixi env (patched Smoldyn with the curved-compartment creation fix).
  inputs_committed: [results/metrics.json]
  wall_time_s: 1040.9784080982208
