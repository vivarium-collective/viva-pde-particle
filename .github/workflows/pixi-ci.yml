# Engine CI for viva-pde-particle (hand-written; not generated from viva-template).
#
# workspace-ci.yml (generated, drift-guarded) checks the lightweight uv install.
# This workflow checks the real research environment:
#   - the pixi env (dolfinx, pyvcell-fvsolver, process-bigraph),
#   - the patched Smoldyn build (OPTION_VCELL),
#   - the full test suite and the workspace lint.
name: pixi-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pixi-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          # --frozen: install exactly pixi.lock without re-validating it against pixi.toml.
          # `--locked` always fails here: viva-superpowers/vivarium-workbench require
          # viva-workspace as `@ git+...@main` while the lock records `?branch=main`, and
          # pixi reports "mismatching git ref: main != main".
          frozen: true
      - name: Engines importable
        run: pixi run check-engines
      - name: Build Smoldyn (OPTION_VCELL, patched)
        run: pixi run build-smoldyn
      - name: Tests
        run: pixi run test
      - name: Workspace lint
        run: pixi run lint
