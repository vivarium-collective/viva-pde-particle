[project]
name = "viva-pde-particle"
version = "0.0.0"
description = "PDE/particle hybrid co-simulation (finite volume / FEniCSx + Smoldyn) with process-bigraph, benchmarked against vcell-fvsolver"
requires-python = ">=3.11"
dependencies = [
    # Floor: 1.8.5 ships the composite `core_extensions` mechanism (1.8.0) the
    # dashboard relies on AND the emitter fix (#217) + `requests`/`fire` server
    # deps. Below this, composite type-registration and agent-embedded emits
    # break — the root cause behind the map[...] type errors seen in the field.
    "process-bigraph>=1.8.5",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    "numpy",
    "scipy",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from viva-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# VCell reference solver (embedded fvsolver hybrid) + VCML/SBML tooling. pyvcell needs Python >=3.12;
# the marker keeps the 3.11 resolution (workspace-ci, publish workflows) satisfiable.
reference = ["pyvcell[solver,native]>=0.3.3; python_version >= '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (viva-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["viva_pde_particle"]

[tool.uv.sources]
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
